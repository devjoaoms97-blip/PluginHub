# Configuração do VipPlugin
#
# IMPORTANTE: este plugin só cuida de QUEM tem VIP, por quanto tempo, e adiciona/remove o
# jogador do grupo certo no LuckPerms (definido em "grupo-luckperms" abaixo). As permissões
# que cada grupo realmente concede (perks, desconto na loja, prefixo, etc.) são configuradas
# no PRÓPRIO LuckPerms — veja o README pra copiar os comandos prontos de setup.

# Kits: o "kit" (/vip kit) é o diário, a cada cooldown-kit-horas; o "kit-semanal" (/vip kitsemanal), a cada
# cooldown-kit-semanal-dias; e o "kit-mensal" (/vip kitmensal), a cada cooldown-kit-mensal-dias.
# O diário só tem consumível que não vende na loja; o que vira dinheiro (minério) fica no semanal.
# Itens: "MATERIAL:quantidade" ou, com encantamentos, "MATERIAL:quantidade:nome=nivel,..." (nomes do
# Minecraft: fortune, efficiency, unbreaking, mending...). O nível pode passar do máximo normal:
# fortune=5 dá Fortuna V. Fortuna acima de III acelera o rankup: veja tools/economia no repositório
# antes de mudar. A Proteção para no V: 4 peças com Proteção V já dão o limite do Minecraft (80% menos
# dano). Afiação acima de V (só no Diamante) é vantagem no PvP sobre quem não é VIP.
# Sorteios: "maquina:tear=60,forja=40" dá uma máquina do MaquinasPlugin sorteada pelos pesos, e
# "tesouro:comum=70,raro=30" um Mapa do Tesouro do TesourosPlugin. Repetir a linha sorteia de novo.
# A máquina acima do rank do jogador fica guardada até ele chegar no rank dela.
tiers:
  BRONZE:
    nome-exibicao: "&7[Bronze]"
    grupo-luckperms: vip_bronze
    desconto-loja-percentual: 5
    particulas-disponiveis: [FLAME, HEART]
    kit:
      - "BREAD:16"
      - "GOLDEN_APPLE:1"
      - "EXPERIENCE_BOTTLE:8"
    cooldown-kit-horas: 24
    kit-semanal:
      - "IRON_INGOT:32"
      - "DIAMOND:4"
      - "GOLDEN_APPLE:4"
    cooldown-kit-semanal-dias: 7
    kit-mensal:
      - "DIAMOND_PICKAXE:1:fortune=3,efficiency=3,unbreaking=3"
      - "DIAMOND_AXE:1:efficiency=3,unbreaking=3"
      - "DIAMOND_HELMET:1:protection=4,unbreaking=3"
      - "DIAMOND_CHESTPLATE:1:protection=4,unbreaking=3"
      - "DIAMOND_LEGGINGS:1:protection=4,unbreaking=3"
      - "DIAMOND_BOOTS:1:protection=4,feather_falling=4,unbreaking=3"
      - "DIAMOND_SWORD:1:sharpness=4,looting=4,unbreaking=3"
      - "BOW:1:power=4,infinity=1,unbreaking=3"
      - "ARROW:1"
      - "SHIELD:1:unbreaking=3"
      - "maquina:tear=100"
      - "tesouro:comum=80,raro=20"
    cooldown-kit-mensal-dias: 30
    # Ao ativar o VIP (/vip add, /vip resgatar). Todo VIP dura 30 dias.
    # O XP sobe os níveis das skills sem pagar o dinheiro por nível delas.
    bonus-ativacao:
      dinheiro-percentual-proximo-rank: 10
      xp-por-skill: 500
    cooldown-heal-minutos: 30
    cooldown-feed-minutos: 15

  PRATA:
    nome-exibicao: "&f[&bPrata&f]"
    grupo-luckperms: vip_prata
    desconto-loja-percentual: 10
    particulas-disponiveis: [FLAME, HEART, HAPPY_VILLAGER]
    kit:
      - "COOKED_BEEF:32"
      - "GOLDEN_APPLE:2"
      - "EXPERIENCE_BOTTLE:16"
      - "ENDER_PEARL:4"
    cooldown-kit-horas: 24
    kit-semanal:
      - "DIAMOND:16"
      - "TOTEM_OF_UNDYING:1"
      - "GOLDEN_APPLE:8"
    cooldown-kit-semanal-dias: 7
    kit-mensal:
      - "NETHERITE_PICKAXE:1:fortune=3,efficiency=4,unbreaking=3"
      - "NETHERITE_AXE:1:efficiency=4,unbreaking=3"
      - "NETHERITE_HELMET:1:protection=4,unbreaking=3"
      - "NETHERITE_CHESTPLATE:1:protection=4,unbreaking=3"
      - "NETHERITE_LEGGINGS:1:protection=4,unbreaking=3"
      - "NETHERITE_BOOTS:1:protection=4,feather_falling=4,unbreaking=3"
      - "NETHERITE_SWORD:1:sharpness=5,looting=5,unbreaking=3"
      - "BOW:1:power=5,infinity=1,unbreaking=3"
      - "ARROW:1"
      - "SHIELD:1:unbreaking=3"
      - "maquina:tear=60,forja=40"
      - "tesouro:comum=60,raro=35,arcano=5"
      - "tesouro:comum=60,raro=35,arcano=5"
    cooldown-kit-mensal-dias: 30
    # Ao ativar o VIP (/vip add, /vip resgatar). Todo VIP dura 30 dias
