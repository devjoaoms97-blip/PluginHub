    cooldown-heal-minutos: 5
    cooldown-feed-minutos: 0

# Códigos de evento (/vip gerarevento <tier> <dias>): prêmio de evento do servidor, nunca vendido nem
# revendido. O VIP que eles dão tem só os benefícios passivos (desconto, venda, XP, montaria, voo...):
# e o kit diário (/vip kit), sem o bônus de ativação (coins e XP) e sem o kit mensal. Quem já tem VIP ativo resgata depois.
codigos-evento:
  dias-permitidos: [3, 7, 15]

# Tag do VIP no chat e na tab: true usa o prefixo do grupo no LuckPerms (/lp group vip_ouro meta
# setprefix "&6[Ouro] "), pra configurar num lugar só. O grupo sem prefixo usa o nome-exibicao de
# cada tier acima, que também aparece nas mensagens (kit, ativação...). false = sempre o nome-exibicao.
tag-do-luckperms: true

# Acima da cabeça vai só UMA tag (na tab e no chat continuam todas): a que o jogador escolhe no /tag
# (vip, apoiador, cla, rank ou nenhuma). Sem escolha, ou se a escolhida sumiu (VIP vencido, saiu do
# clã), vale a primeira desta lista que ele tem.
tag-na-cabeca:
  padrao: [vip, rank]

# Liga/desliga cada perk globalmente, independente de permissão. Útil pra desativar um perk
# temporariamente (ex: manutenção) sem mexer nos grupos do LuckPerms.
perks:
  fly: true
  heal: true
  feed: true
  kit: true
  particulas: true
  warp: true
  pocoes: true

# /vip pocoes (perk vip.perk.pocoes): junta as poções iguais do inventário em pilhas de até max-pilha.
pocoes:
  max-pilha: 10

# Destino do /vip warp — uma área exclusiva pra quem tem qualquer tier de VIP com o perk "warp".
warp-vip:
  mundo: world
  x: 0
  y: 100
  z: 0
  # Áreas próprias de cada tier (opcional): o tier sem área aqui vai pra área geral acima.
  # A staff marca com /vip setwarp <tier> no lugar certo.
  # tiers:
  #   diamante: {mundo: spawn, x: 0, y: 65, z: 0, yaw: 0}

# A cada quantos minutos o plugin varre os VIPs ativos e remove quem já expirou.
verificacao-expiracao-minutos: 5

codigos:
  # Prazo padrão (em dias) pra um código gerado com /vip gerarcodigo ser resgatado. Passou
  # disso sem ninguém resgatar, o código some (mesmo se estiver à venda). 0 = não expira.
  # Dá pra sobrescrever por código: /vip gerarcodigo <tier> [usos] [validade-dias].
  # Códigos gerados antes dessa opção existir continuam sem prazo.
  validade-padrao-dias: 0

revenda:
  # Permite jogadores revenderem, por coins, um código de VIP que eles ainda não resgataram
  # (ex: recebido da staff numa compra no Discord) — nunca um VIP já ativo (/vip vender).
  ativado: true
  # Quando um jogador coloca um código à venda, anuncia pra TODO o servidor uma mensagem
  # clicável que já roda /vip resgatar na hora do clique. Se false, o
  # vendedor só recebe o código em privado pra repassar manualmente (ex: combinado no Discord).
  anunciar-publicamente: true
  # Percentual descontado de toda revenda entre jogadores — o dinheiro simplesmente some,
  # não vai pra ninguém. Funciona como sink, igual o imposto da loja e a taxa do Pix: sem
  # isso, comprar código de staff e revender pro servidor inteiro viraria uma forma de
  # imprimir coins do nada. 0 desativa.
  taxa-percentual: 10.0
  # O preço no /vip vender é livre (sem mínimo nem máximo): é economia entre jogadores.

mensagens:
  vip-adicionado: "&aVocê recebeu o VIP &f{tier}&a! Válido até &f{data}&a."
  vip-expirado: "&cSeu VIP &f{tier}&c expirou. Fale com a staff pra renovar!"
