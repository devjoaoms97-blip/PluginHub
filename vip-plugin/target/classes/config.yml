# Configuração do VipPlugin
#
# IMPORTANTE: este plugin só cuida de QUEM tem VIP, por quanto tempo, e adiciona/remove o
# jogador do grupo certo no LuckPerms (definido em "grupo-luckperms" abaixo). As permissões
# que cada grupo realmente concede (perks, desconto na loja, prefixo, etc.) são configuradas
# no PRÓPRIO LuckPerms — veja o README pra copiar os comandos prontos de setup.

# Itens dos kits: "MATERIAL:quantidade" ou, com encantamentos, "MATERIAL:quantidade:nome=nivel,..."
# (nomes do Minecraft: fortune, efficiency, unbreaking, mending...). O nível pode passar do
# máximo normal: fortune=5 dá Fortuna V. O "kit" sai a cada cooldown-kit-horas (/vip kit) e o
# "kit-mensal", com as ferramentas, a cada cooldown-kit-mensal-dias (/vip kitmensal).
# Fortuna acima de III acelera o rankup: veja tools/economia no repositório antes de mudar.
# Armas e armaduras também passam do máximo normal (Afiação VII, Força VII no
# Diamante, diminuindo nos outros). A Proteção para de fazer diferença no V: 4 peças com
# Proteção V já dão o limite do Minecraft (80% menos dano).
tiers:
  BRONZE:
    nome-exibicao: "&7[Bronze]"
    grupo-luckperms: vip_bronze
    desconto-loja-percentual: 5
    kit:
      - "IRON_INGOT:8"
      - "BREAD:16"
      - "GOLDEN_APPLE:1"
    particulas-disponiveis: [FLAME, HEART]
    cooldown-kit-horas: 24
    kit-mensal:
      - "DIAMOND_PICKAXE:1:fortune=3,efficiency=3,unbreaking=3"
      - "DIAMOND_AXE:1:efficiency=3,unbreaking=3"
      - "DIAMOND_HELMET:1:protection=4,unbreaking=3"
      - "DIAMOND_CHESTPLATE:1:protection=4,unbreaking=3"
      - "DIAMOND_LEGGINGS:1:protection=4,unbreaking=3"
      - "DIAMOND_BOOTS:1:protection=4,feather_falling=4,unbreaking=3"
      - "DIAMOND_SWORD:1:sharpness=4,looting=4,unbreaking=3"
      - "BOW:1:power=4,infinity=1,unbreaking=3"
      - "ARROW:1"
      - "SHIELD:1:unbreaking=3"
      - "GOLDEN_APPLE:8"
    cooldown-kit-mensal-dias: 30
    # Ao ativar o VIP (/vip add, /vip resgatar). Todo VIP dura 30 dias.
    # O XP sobe os níveis das skills sem pagar o dinheiro por nível delas.
    bonus-ativacao:
      dinheiro-percentual-proximo-rank: 10
      xp-por-skill: 500
    cooldown-heal-minutos: 30
    cooldown-feed-minutos: 15

  PRATA:
    nome-exibicao: "&f[&bPrata&f]"
    grupo-luckperms: vip_prata
    desconto-loja-percentual: 10
    kit:
      - "DIAMOND:2"
      - "GOLDEN_APPLE:2"
      - "COOKED_BEEF:32"
    particulas-disponiveis: [FLAME, HEART, HAPPY_VILLAGER]
    cooldown-kit-horas: 24
    kit-mensal:
      - "NETHERITE_PICKAXE:1:fortune=3,efficiency=4,unbreaking=3"
      - "NETHERITE_AXE:1:efficiency=4,unbreaking=3"
      - "NETHERITE_HELMET:1:protection=5,unbreaking=3"
      - "NETHERITE_CHESTPLATE:1:protection=5,unbreaking=3"
      - "NETHERITE_LEGGINGS:1:protection=5,unbreaking=3"
      - "NETHERITE_BOOTS:1:protection=5,feather_falling=4,unbreaking=3"
      - "NETHERITE_SWORD:1:sharpness=5,looting=5,unbreaking=3"
      - "BOW:1:power=5,infinity=1,unbreaking=3"
      - "ARROW:1"
      - "SHIELD:1:unbreaking=3"
      - "GOLDEN_APPLE:16"
      - "ENDER_PEARL:16"
    cooldown-kit-mensal-dias: 30
    # Ao ativar o VIP (/vip add, /vip resgatar). Todo VIP dura 30 dias
    bonus-ativacao:
      dinheiro-percentual-proximo-rank: 20
      xp-por-skill: 1500
    cooldown-heal-minutos: 20
    cooldown-feed-minutos: 10

  OURO:
    nome-exibicao: "&6[Ouro]"
    grupo-luckperms: vip_ouro
    desconto-loja-percentual: 15
    kit:
      - "DIAMOND:4"
      - "GOLDEN_APPLE:4"
      - "ENDER_PEARL:8"
    particulas-disponiveis: [FLAME, HEART, HAPPY_VILLAGER, PORTAL]
    cooldown-kit-horas: 12
    kit-mensal:
      - "NETHERITE_PICKAXE:1:fortune=4,efficiency=5,unbreaking=3,mending=1"
      - "NETHERITE_AXE:1:efficiency=5,unbreaking=3,mending=1"
      - "NETHERITE_HELMET:1:protection=6,unbreaking=3,mending=1"
      - "NETHERITE_CHESTPLATE:1:protection=6,unbreaking=3,mending=1"
      - "NETHERITE_LEGGINGS:1:protection=6,unbreaking=3,mending=1"
      - "NETHERITE_BOOTS:1:protection=6,feather_falling=4,unbreaking=3,mending=1"
      - "NETHERITE_SWORD:1:sharpness=6,unbreaking=3,mending=1"
      - "BOW:1:power=6,infinity=1,unbreaking=3,mending=1"
      - "ARROW:1"
      - "SHIELD:1:unbreaking=3"
      - "CROSSBOW:1:quick_charge=3,multishot=1,unbreaking=3,mending=1"
      - "NETHERITE_SPEAR:1:sharpness=6,unbreaking=3,mending=1"
      - "GOLDEN_APPLE:16"
      - "ENCHANTED_GOLDEN_APPLE:1"
      - "TOTEM_OF_UNDYING:2"
      - "ENDER_PEARL:16"
    cooldown-kit-mensal-dias: 30
    # Ao ativar o VIP (/vip add, /vip resgatar). Todo VIP dura 30 dias
    bonus-ativacao:
      dinheiro-percentual-proximo-rank: 35
      xp-por-skill: 3000
    cooldown-heal-minutos: 10
    cooldown-feed-minutos: 5

  DIAMANTE:
    nome-exibicao: "&b[Diamante]"
    grupo-luckperms: vip_diamante
    desconto-loja-percentual: 20
    kit:
      - "DIAMOND_BLOCK:2"
      - "NETHERITE_INGOT:1"
      - "GOLDEN_APPLE:8"
    particulas-disponiveis: [FLAME, HEART, HAPPY_VILLAGER, PORTAL, TOTEM_OF_UNDYING]
    cooldown-kit-horas: 6
    kit-mensal:
      - "NETHERITE_PICKAXE:1:fortune=5,efficiency=5,unbreaking=3,mending=1"
      - "NETHERITE_AXE:1:efficiency=5,unbreaking=3,mending=1"
      - "NETHERITE_HELMET:1:protection=7,unbreaking=3,mending=1"
      - "NETHERITE_CHESTPLATE:1:protection=7,unbreaking=3,mending=1"
      - "NETHERITE_LEGGINGS:1:protection=7,unbreaking=3,mending=1"
      - "NETHERITE_BOOTS:1:protection=7,feather_falling=4,unbreaking=3,mending=1"
      - "NETHERITE_SWORD:1:sharpness=7,unbreaking=3,mending=1,fire_aspect=2"
      - "BOW:1:power=7,infinity=1,unbreaking=3,mending=1,flame=1"
      - "ARROW:1"
      - "SHIELD:1:unbreaking=3"
      - "CROSSBOW:1:quick_charge=3,multishot=1,unbreaking=3,mending=1"
      - "NETHERITE_SPEAR:1:sharpness=7,unbreaking=3,mending=1"
      - "MACE:1:density=7,unbreaking=3,mending=1"
      - "TRIDENT:1:impaling=7,loyalty=3,unbreaking=3,mending=1"
      - "ELYTRA:1:unbreaking=3,mending=1"
      - "GOLDEN_APPLE:32"
      - "ENCHANTED_GOLDEN_APPLE:3"
      - "TOTEM_OF_UNDYING:4"
      - "ENDER_PEARL:16"
      - "FIREWORK_ROCKET:64"
    cooldown-kit-mensal-dias: 30
    # Ao ativar o VIP (/vip add, /vip resgatar). Todo VIP dura 30 dias
    bonus-ativacao:
      dinheiro-percentual-proximo-rank: 50
      xp-por-skill: 5000
    cooldown-heal-minutos: 5
    cooldown-feed-minutos: 0

# Códigos de evento (/vip gerarevento <tier> <dias>): prêmio de evento do servidor, nunca vendido nem
# revendido. O VIP que eles dão tem só os benefícios passivos (desconto, venda, XP, montaria, voo...):
# e o kit diário (/vip kit), sem o bônus de ativação (coins e XP) e sem o kit mensal. Quem já tem VIP ativo resgata depois.
codigos-evento:
  dias-permitidos: [3, 7, 15]

# Tag do VIP no chat e na tab: true usa o prefixo do grupo no LuckPerms (/lp group vip_ouro meta
# setprefix "&6[Ouro] "), pra configurar num lugar só. O grupo sem prefixo usa o nome-exibicao de
# cada tier acima, que também aparece nas mensagens (kit, ativação...). false = sempre o nome-exibicao.
tag-do-luckperms: true

# Liga/desliga cada perk globalmente, independente de permissão. Útil pra desativar um perk
# temporariamente (ex: manutenção) sem mexer nos grupos do LuckPerms.
perks:
  fly: true
  heal: true
  feed: true
  kit: true
  particulas: true
  warp: true

# Destino do /vip warp — uma área exclusiva pra quem tem qualquer tier de VIP com o perk "warp".
warp-vip:
  mundo: world
  x: 0
  y: 100
  z: 0
  # Áreas próprias de cada tier (opcional): o tier sem área aqui vai pra área geral acima.
  # A staff marca com /vip setwarp <tier> no lugar certo.
  # tiers:
  #   diamante: {mundo: spawn, x: 0, y: 65, z: 0, yaw: 0}

# A cada quantos minutos o plugin varre os VIPs ativos e remove quem já expirou.
verificacao-expiracao-minutos: 5

codigos:
  # Prazo padrão (em dias) pra um código gerado com /vip gerarcodigo ser resgatado. Passou
  # disso sem ninguém resgatar, o código some (mesmo se estiver à venda). 0 = não expira.
  # Dá pra sobrescrever por código: /vip gerarcodigo <tier> [usos] [validade-dias].
  # Códigos gerados antes dessa opção existir continuam sem prazo.
  validade-padrao-dias: 0

revenda:
  # Permite jogadores revenderem, por coins, um código de VIP que eles ainda não resgataram
  # (ex: recebido da staff numa compra no Discord) — nunca um VIP já ativo (/vip vender).
  ativado: true
  # Quando um jogador coloca um código à venda, anuncia pra TODO o servidor uma mensagem
  # clicável (igual o /pix qrcode) que já roda /vip resgatar na hora do clique. Se false, o
  # vendedor só recebe o código em privado pra repassar manualmente (ex: combinado no Discord).
  anunciar-publicamente: true
  # Percentual descontado de toda revenda entre jogadores — o dinheiro simplesmente some,
  # não vai pra ninguém. Funciona como sink, igual o imposto da loja e a taxa do Pix: sem
  # isso, comprar código de staff e revender pro servidor inteiro viraria uma forma de
  # imprimir coins do nada. 0 desativa.
  taxa-percentual: 10.0
  # Faixa de preço permitida no /vip vender, por tier (0 = sem limite). Evita "lavar" dinheiro
  # entre contas com um VIP vendido por 1 milhão, ou derrubar o mercado vendendo por 1 coin.
  precos:
    bronze:
      minimo: 5000
      maximo: 100000
    prata:
      minimo: 10000
      maximo: 200000
    ouro:
      minimo: 20000
      maximo: 400000
    diamante:
      minimo: 40000
      maximo: 800000

mensagens:
  vip-adicionado: "&aVocê recebeu o VIP &f{tier}&a! Válido até &f{data}&a."
  vip-expirado: "&cSeu VIP &f{tier}&c expirou. Fale com a staff pra renovar!"
