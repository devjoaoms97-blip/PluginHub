name: FazendasPlugin
version: '1.0.0'
main: com.example.fazendas.FazendasPlugin
api-version: '26.2'
author: Você
description: Fazendas nos terrenos (Escrituras negociáveis) que rendem dinheiro com Ração e Adubo.
softdepend: [Vault, RankupPlugin, PixPlugin, TerrenosPlugin]

commands:
  fazendas:
    description: Loja das fazendas e comandos da staff.
    usage: "Uso: /fazendas loja"
    aliases: [fazenda]

permissions:
  fazendas.admin:
    description: Dá escrituras e insumos, lista as fazendas, abre qualquer uma e remove pelo comando.
    default: op
