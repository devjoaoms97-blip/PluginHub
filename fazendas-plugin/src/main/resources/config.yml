# Configuração do FazendasPlugin
#
# A fazenda é uma construção 7x7 no terreno, colocada com uma Escritura (item negociável). Ela não
# dá itens: cada safra põe dinheiro no cofre, que o dono coleta no NPC. Gasta Ração (animais) ou
# Adubo (plantações). Ninguém quebra bloco da construção: ela só sai recolhendo a Escritura no NPC.

# Fazenda só nos mundos abaixo (o dos terrenos).
mundos: [terrenos]

# Fazendas em cada terreno, somando todos os tipos e todos os donos (separado do limite das máquinas).
limite-por-terreno: 4

# A área da construção: 7x7, com o chão uma camada abaixo do bloco clicado. Acima do chão, tantos
# blocos precisam estar livres (ar, grama, flor): 5 cabe o moinho do Trigal, as macieiras do Pomar e o
# cogumelo gigante. Mudar não mexe nas fazendas já colocadas (cada uma guarda a altura dela).
altura-livre: 5
# Quanto tempo a prévia (o contorno) fica valendo: o segundo clique no mesmo bloco constrói.
previa-segundos: 30

# Com o dono offline, a fazenda produz nessa fração da velocidade (como as máquinas).
producao-offline: 0.5

# Cofre: guarda o dinheiro de tantas safras (mais tantas por nível da melhoria de Cofre).
cofre-base: 96
cofre-por-nivel: 64
# Despensa: cabe insumo pra tantas safras (mais tantas por nível), e nunca menos que "minimo".
despensa:
  safras-base: 96
  safras-por-nivel: 64
  minimo: 64
# Produtividade: cada nível tira essa % do tempo de cada safra.
produtividade-por-nivel: 5
nivel-maximo: 5
# Melhoria custa: preço da fazenda × este fator × (nível atual + 1). O dinheiro sai de circulação.
custo-melhoria: 0.3

# Os insumos (compra no balcão das fazendas).
insumos:
  racao:
    nome: "&6Ração"
    preco: 25
  adubo:
    nome: "&2Adubo"
    preco: 25

# Achado raro (2026-11-17): a cada safra, uma chance de a fazenda achar o item raro dela (Ovo Dourado,
# Lã de Ouro...), que fica guardado na fazenda até o dono pegar no menu, e vende no Corretor Rural.
# A chance sai pra dar ~1 achado a cada "horas-online" de produção (no ritmo do nível 0; a
# Produtividade faz mais safras, e acha um pouco mais), e cada um vale "horas-de-renda" da renda dela
# (antes do bônus do rank e do VIP, que entram na venda, como na coleta). 1,5 h a cada 48 h: ~3% a mais.
raro:
  horas-online: 48
  horas-de-renda: 1.5

# Na coleta, o cofre recebe o bônus do rank e o do VIP abaixo, menos o imposto (como a venda das máquinas).
imposto-coleta: 2
vip-bonus-coleta:
  - permissao: "vip.desconto.diamante"
    percentual: 12
  - permissao: "vip.desconto.ouro"
    percentual: 9
  - permissao: "vip.desconto.prata"
    percentual: 6
  - permissao: "vip.desconto.bronze"
    percentual: 3

# As fazendas, na ordem da loja. Calibradas pelo tools/economia/fazendas.py (2026-11-17): cada uma
# lucra ~7% da mina do rank em que libera (renda menos o insumo, sem bônus) e se paga em ~20 h de
# produção online, como as máquinas. "icone" é o item que representa a fazenda nos menus; "mao", o que o
# fazendeiro segura; "skin" (opcional), o nome de um jogador ou "textura:<hash>" pra skin do fazendeiro;
# "raro", o achado raro dela (o nome e o item do Minecraft que desenha ele, com brilho).
# A construção de cada uma (blocos e bichos) está no código (Planos.java).
