# Configuração do MaquinasPlugin
#
# Máquina só nos mundos abaixo (o dos terrenos: cada um no seu).
mundos: [terrenos]

# Máquinas em cada terreno, somando todos os tipos e todos os donos (10 forjas, ou 5 forjas e 5
# teares...). Sem o TerrenosPlugin, o limite vale por jogador.
limite-por-terreno: 10

# Tanque de cada máquina (2026-11-07): cabe combustível pra "produtos-base" produtos, mais
# "produtos-por-nivel" por nível da melhoria de Tanque (como o estoque), no consumo de cada máquina: o
# Reator (4 por produto) e o Tear (0,25) têm a mesma autonomia. Nunca menos que "minimo-celulas" (o
# tanque de antes, fixo em 64, que ainda vale pro Tear e a Forja no nível 0).
tanque:
  produtos-base: 96
  produtos-por-nivel: 64
  minimo-celulas: 64
# Velocidade da produção com o dono offline (2026-11-10): 0.5 = metade. A máquina recompensa quem
# joga; offline ela segue, mais devagar (com o dono online, a velocidade cheia).
producao-offline: 0.5

# Estoque de produtos: base, e quanto cada nível de melhoria de estoque soma. Com 96, a máquina
# mais rápida enche em ~1h36: ela recompensa quem passa pra coletar, não quem some por dias.
estoque-base: 96
estoque-por-nivel: 64
# Melhorias: velocidade, estoque e tanque, até nivel-maximo cada. Cada nível de velocidade tira essa % do tempo por produto (nível 5 com 5%: 25% menos tempo, 1,33x
# mais produtos). Com as 10 máquinas de um terreno no máximo, fica perto de ~134% da mina
# (tools/economia/maquinas.py).
velocidade-por-nivel: 5
nivel-maximo: 5
# Melhoria custa: preço da máquina × este fator × (nível atual + 1). O dinheiro sai de circulação.
custo-melhoria: 0.3

combustivel:
  nome: "&6Célula de Combustível"
  preco: 25

# Preço dinâmico dos produtos (cair a cada venda e voltar com o tempo): desligado desde 2026-11-07, como
# o da Loja Oficial. Sem ele, cada produto vende sempre na âncora (mais o bônus do rank e do VIP, menos o
# imposto), e "minimo", "passo" e "regeneracao" não valem.
preco-dinamico: false

# Venda dos produtos (com o dinâmico ligado): o preço é de cada jogador. Cada unidade que ele vende baixa o preço DELE em
# "passo"% (até o mínimo), e ele volta pra âncora com o tempo; as vendas de um não mexem no preço dos
# outros. A venda tem o bônus do rank e o do VIP abaixo, menos o imposto.
imposto-venda: 2
regeneracao:
  intervalo-segundos: 60
  fator: 0.02
vip-bonus-venda:
  - permissao: "vip.desconto.diamante"
    percentual: 12
  - permissao: "vip.desconto.ouro"
    percentual: 9
  - permissao: "vip.desconto.prata"
    percentual: 6
  - permissao: "vip.desconto.bronze"
    percentual: 3

# Os produtos (o id é o nome da textura no resource pack: servidor:<id>). Calibrados pelo
# tools/economia/maquinas.py (2026-10-31):
# - minimo: 25% acima do combustível de uma unidade, já pagando o imposto. Vender no mínimo ainda dá
#   lucro (antes, o Tecido, a Barra e a Essência tinham o mínimo abaixo do combustível);
# - passo: com o terreno cheio de uma máquina, na velocidade máxima e vendendo tudo, o preço do
#   jogador se estabiliza em ~75% da âncora (com 0,2% em todos, o Tecido ia pra ~R$ 7, quase o custo).
produtos:
  tecido_fino:
    nome: "&cTecido Fino"
    ancora: 16
    minimo: 8
    passo: 0.05
  barra_de_aco:
    nome: "&7Barra de Aço"
    ancora: 42
    minimo: 16
    passo: 0.05
  essencia_destilada:
    nome: "&dEssência Destilada"
    ancora: 100
    minimo: 32
    passo: 0.08
  gema_lapidada:
    nome: "&5Gema Lapidada"
    ancora: 280
    minimo: 64
    passo: 0.1
  cristal_de_energia:
    nome: "&bCristal de Energia"
    ancora: 1850
    minimo: 370
    passo: 0.15

# As máquinas (o id é o modelo no resource pack: servidor:maquina_<id>), na ordem da loja.
# Calibradas pelo tools/economia/maquinas.py: cada máquina rende ~10% da mina no rank em que libera
# (no preço de âncora, já tirando o combustível). A Lapidadora e o Reator custam 25% a mais desde 2026-11-10
# (8 Lapidadoras rendiam R$ 230 mil por tanque cheio): se pagam em umas 25 h de produção online, e a
# melhoria deles (preço × custo-melhoria) subiu junto. As outras se pagam em umas 20 h.
maquinas:
  tear:
    nome: "&cTear"
    produto: tecido_fino
    intervalo-segundos: 60
    combustivel-por-produto: 0.25
    preco: 12000
    rank: fazendeiro
  forja:
    nome: "&7Forja"
    produto: barra_de_aco
    intervalo-segundos: 60
    combustivel-por-produto: 0.5
    preco: 35000
    rank: ferreiro
  destilaria:
    nome: "&dDestilaria"
    produto: essencia_destilada
    intervalo-segundos: 90
    combustivel-por-produto: 1
    preco: 60000
    rank: mercador
  lapidadora:
    nome: "&5Lapidadora"
    produto: gema_lapidada
    intervalo-segundos: 120
    combustivel-por-produto: 2
    preco: 175000
    rank: clerigo
  reator:
    nome: "&bReator Arcano"
    produto: cristal_de_energia
    intervalo-segundos: 180
    combustivel-por-produto: 4
    preco: 875000
    rank: conde

integracao:
  pix: true
