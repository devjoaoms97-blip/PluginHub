# Configuração do PlacarPlugin (scoreboard lateral)
#
# Título e linhas (no máximo 15), de cima pra baixo. '&' pras cores. Placeholders:
#   {jogador} {saldo} {rank} {proximo-rank} {progresso} {cla} {missoes} {skill} {skill-progresso}
#   {boss} {online} {max}
# Cada informação vem do plugin dela (Rankup, Clãs, Missões, Skills, Boss); sem o plugin, aparece "—".
# {skill} é a skill treinada no último minuto (ou a da arma na mão), com o nível; {skill-progresso}
# é a barra até o próximo nível dela.
# Linhas iguais (ex: duas vazias) podem repetir à vontade.

titulo: "&6&l⛏ RANKUP"

linhas:
  - "&8&m                    "
  - "&fSaldo: &a{saldo}"
  - "&fRank: {rank}"
  - "&fPróximo: {proximo-rank}"
  - " {progresso}"
  - ""
  - "&fClã: {cla}"
  - "&fMissões hoje: {missoes}"
  - "&fSkill: {skill}"
  - " {skill-progresso}"
  - "&fPróximo boss: &e{boss}"
  - ""
  - "&fOnline: &a{online}&7/{max}"
  - "&8&m                    "

# As tags no nome acima da cabeça: as mesmas da tab (rank, clã, VIP, apoiador e a cor do nome).
nome-na-cabeca:
  ativado: true

# A vida embaixo do nome, acima da cabeça: "18 ❤" (a vida em pontos, 20 = 10 corações; a absorção,
# dos corações dourados, entra junto). Pedido de 2026-11-06.
vida-na-cabeca:
  ativado: true
  simbolo: "&c❤"

textos:
  sem-cla: "&7nenhum"
  sem-skill: "&7nenhuma"

# De quantos em quantos ticks o placar se atualiza (20 ticks = 1 s). Mínimo 10.
intervalo-ticks: 40

# Mundos onde o placar não aparece (ex: arena de evento com placar próprio).
mundos-sem-placar: []
