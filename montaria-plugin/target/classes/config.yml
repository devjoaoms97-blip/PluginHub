# Configuração do MontariaPlugin (montaria do VIP no spawn)
#
# /montaria chama a montaria (e de novo manda ela embora). Precisa da permissão vip.perk.montaria,
# que os grupos de VIP do LuckPerms dão. Ela some quando o jogador desce, sai, se teleporta, troca de
# mundo, toma dano ou entra num lugar proibido.

# Mundos onde dá pra usar. Fora deles, a montaria nem aparece.
mundos: [spawn]

# Caixas proibidas ([x, y, z] dos cantos): ao entrar, a montaria some e o jogador segue a pé. Os poços
# das minas do RankupPlugin já são proibidos sozinhos (não precisa pôr aqui).
proibido:
  # A arena do boss, enterrada ao sul do spawn, com a escadaria (estrutura "toxica"): é luta, e tem PvP.
  - nome: "arena do boss"
    mundo: spawn
    min: [-60, 0, 107]
    max: [60, 100, 253]

# Velocidade: tantas vezes a corrida a pé (5,6 blocos por segundo). 1.6 é um cavalo médio do jogo; 3 é
# bem mais rápido que qualquer cavalo (16,8 blocos por segundo).
velocidade-vezes-corrida: 3.0
# Força do pulo (0.5 sobe um degrau e não pula balcão nem barraca; 0.7 é o cavalo comum).
pulo: 0.5
# Segundos entre chamar uma montaria e outra.
recarga-segundos: 5

# A montaria de cada um: a primeira da lista cuja permissão o jogador tem. Qualquer tipo de cavalo do
# jogo (HORSE, SKELETON_HORSE, ZOMBIE_HORSE, DONKEY, MULE, CAMEL). Sem nenhuma, tipo-padrao.
# Exemplo, pra variar por tier:
#   - {permissao: "vip.xp.diamante", tipo: SKELETON_HORSE}
tipos: []
tipo-padrao: HORSE

# Skins de montaria (compradas com créditos no CreditosPlugin): o cavalo fica invisível e leva o
# modelo 3D do bicho (resource pack, tools/pacote/montarias.py). Velocidade e pulo não mudam.
#   escala-do-cavalo: o tamanho do cavalo invisível, que muda a altura em que o jogador senta (1 = 1,3 bloco)
#   ajuste-altura: sobe (+) ou desce (-) o modelo, em blocos, se ele não encostar no chão
#   anima-parado: anima mesmo parado (o tapete ondula); ticks-por-quadro: ritmo andando (e parado)
#   particula: sai embaixo da montaria (partícula sem dado extra)
#   fmm-modelo: usa o modelo animado do FreeMinecraftModels com esse id (o nome do .bbmodel em
#     plugins/FreeMinecraftModels/models) em vez do nosso modelo de caixas
skins:
  rena: {escala-do-cavalo: 1.0, fmm-modelo: reindeer}
  bode: {escala-do-cavalo: 1.0, fmm-modelo: goated}
  caranguejo: {escala-do-cavalo: 1.0, fmm-modelo: krab}
  peixe: {escala-do-cavalo: 1.0, fmm-modelo: styx_fish}
  aviao: {escala-do-cavalo: 1.0, fmm-modelo: biplane1}
  arara: {escala-do-cavalo: 1.0}
  capivara: {escala-do-cavalo: 0.75}
  onca: {escala-do-cavalo: 1.0}
  lobo_de_gelo: {escala-do-cavalo: 1.0, particula: SNOWFLAKE}
  grifo: {escala-do-cavalo: 1.1}
  tapete: {escala-do-cavalo: 0.5, anima-parado: true, ticks-por-quadro-parado: 5, particula: ENCHANT}
  dragao: {escala-do-cavalo: 1.15}
# Giro do modelo em relação ao cavalo, em graus (o item display desenha o item virado de costas: 180).
skins-giro: 180

nome: "&6Montaria de %jogador%"
silenciosa: false

mensagens:
  sem-permissao: "&cA montaria é um benefício do VIP. Veja &f/vip&c."
  lugar-proibido: "&cAqui não dá pra usar a montaria (%lugar%)."
  saiu: "&7Sua montaria não entra aqui (%lugar%): siga a pé."
