name: RecursosPlugin
version: '1.1.0'
main: com.example.recursos.RecursosPlugin
api-version: '26.2'
author: Você
description: Mundos de recursos (normal, Nether e End) com teleporte seguro, borda, reset mensal, mapa de localização e o centro do End.
depend: [Multiverse-Core]

commands:
  recursos:
    description: Vai pro mundo de recursos (ponto aleatório seguro).
    usage: "Uso: /recursos [info]"
    aliases: [rtp, recurso]
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."
  nether:
    description: Vai pro Nether de recursos (ponto aleatório seguro).
    usage: "Uso: /nether [info]"
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."
  end:
    description: Vai pro centro do End de recursos.
    usage: "Uso: /end [info]"
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."
  mapa:
    description: Mapa de localização de um mundo de recursos.
    usage: "Uso: /mapa <recursos|nether|end>"
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."

permissions:
  recursos.usar:
    description: Usa o /recursos, o /nether, o /end e o /mapa.
    default: true
  recursos.admin:
    description: Reseta os mundos, renasce o dragão, ignora a espera do teleporte e constrói no centro do End (no criativo).
    default: op
