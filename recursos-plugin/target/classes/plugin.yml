name: RecursosPlugin
version: '1.1.0'
main: com.example.recursos.RecursosPlugin
api-version: '26.2'
author: Você
description: Mundos de recursos (normal, Nether e End) pelo /warp, com teleporte seguro, borda, reset mensal, mapa de localização e o centro do End.
depend: [Multiverse-Core]

commands:
  recursos:
    description: Datas dos resets dos mundos de recursos (ir é pela warp).
    usage: "Uso: /recursos [info] [mundo]"
    aliases: [recurso]
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."
  luz:
    description: Liga e desliga a visão noturna.
    usage: "Uso: /luz"
    aliases: [visao]
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."
  mapa:
    description: Mapa de localização de um mundo de recursos.
    usage: "Uso: /mapa <recursos|nether|end>"
    permission: recursos.usar
    permission-message: "§cVocê não tem permissão."

permissions:
  recursos.usar:
    description: Vai pros mundos (/warp recursos, nether e end) e usa o /recursos, o /mapa e o /luz.
    default: true
  recursos.admin:
    description: Reseta os mundos, renasce o dragão, ignora a espera do teleporte e constrói no centro do End (no criativo).
    default: op
