# Configuração do MissoesPlugin
#
# Toda meia-noite (horário do servidor), cada jogador recebe "missoes-por-dia" missões
# sorteadas do pool abaixo, sem repetir. Completar uma paga na hora; completar todas paga
# o bônus. A recompensa em coins é dinheiro NOVO entrando na economia — use o
# /economia (PainelEconomiaPlugin) pra acompanhar quanto as missões estão injetando.

missoes-por-dia: 3

# Missões diárias a mais por permissão (vale a maior). O VipPlugin dá vip.missao.extra pros
# tiers Ouro e Diamante pelos grupos do LuckPerms. Quem vira VIP no meio do dia ganha a extra
# na hora. É uma LISTA de propósito: chave com ponto viraria seção aninhada.
vip-missoes-extras:
  ativado: true
  permissoes:
    - permissao: "vip.missao.extra"
      quantidade: 1

bonus-todas:
  coins: 300
  # Opcional: XP de uma skill do SkillsPlugin (nome da skill, ex: DEFESA). Sem o SkillsPlugin,
  # o XP é ignorado.
  skill: AGILIDADE
  xp: 150

anti-farm:
  # Mob nascido de spawner não conta pra missão de matar (evita farm AFK).
  ignorar-mobs-de-spawner: true
  # Missão de vender: o que o jogador COMPROU da loja no mesmo dia não conta quando ele vende
  # de volta (sempre ligado; precisa do EconomyShopPlugin atualizado).

gui:
  # /missoes abre um menu. Com false, mostra no chat (o /missoes lista sempre mostra no chat).
  ativado: true

# ---------------------------------------------------------------------------------
# POOL DE MISSÕES
#   id:         único, sem espaço
#   tipo:       minerar | colher | matar | pescar | vender | dano_boss
#   alvos:      lista de materiais (minerar/colher/pescar/vender) ou tipos de mob (matar,
#               e dano_boss: o mob do boss, ex. ZOMBIE). Sem "alvos" = qualquer um conta.
#   quantidade: quanto precisa (vender = itens vendidos pra loja; dano_boss = pontos de dano)
#   descricao:  o que aparece pro jogador
#   coins:      recompensa em dinheiro
#   skill + xp: (opcional) XP de skill do SkillsPlugin
#
# "minerar" não conta bloco colocado por jogador; "colher" só conta planta madura.
# "vender" precisa do EconomyShopPlugin; "dano_boss" precisa do BossPlugin — como o boss só
# aparece em alguns horários, ela fica melhor no pool semanal.
# ---------------------------------------------------------------------------------
pool:
  - id: minerar_pedra
    tipo: minerar
    alvos: [STONE, DEEPSLATE, COBBLESTONE, COBBLED_DEEPSLATE]
    quantidade: 256
    descricao: "Minerar 256 pedras"
    coins: 150

  - id: minerar_carvao
    tipo: minerar
    alvos: [COAL_ORE, DEEPSLATE_COAL_ORE]
    quantidade: 32
    descricao: "Minerar 32 minérios de carvão"
    coins: 200

  - id: minerar_ferro
    tipo: minerar
    alvos: [IRON_ORE, DEEPSLATE_IRON_ORE]
    quantidade: 24
    descricao: "Minerar 24 minérios de ferro"
    coins: 300

  - id: minerar_diamante
    tipo: minerar
    alvos: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
    quantidade: 5
    descricao: "Minerar 5 minérios de diamante"
    coins: 600

  - id: cortar_madeira
    tipo: minerar
    alvos: [OAK_LOG, BIRCH_LOG, SPRUCE_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG, PALE_OAK_LOG]
    quantidade: 64
    descricao: "Cortar 64 troncos"
    coins: 150

  - id: colher_trigo
    tipo: colher
    alvos: [WHEAT]
    quantidade: 64
    descricao: "Colher 64 trigos maduros"
    coins: 150

  - id: colher_cenoura_batata
    tipo: colher
    alvos: [CARROTS, POTATOES]
    quantidade: 64
    descricao: "Colher 64 cenouras ou batatas maduras"
    coins: 150

  - id: matar_zumbis
    tipo: matar
    alvos: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER]
    quantidade: 20
    descricao: "Matar 20 zumbis"
    coins: 250
    skill: ESPADAS
    xp: 200

  - id: matar_esqueletos
    tipo: matar
    alvos: [SKELETON, STRAY, BOGGED]
    quantidade: 15
    descricao: "Matar 15 esqueletos"
    coins: 250
    skill: ARQUEIRO
    xp: 200

  - id: matar_creepers
    tipo: matar
    alvos: [CREEPER]
    quantidade: 10
    descricao: "Matar 10 creepers"
    coins: 300
    skill: DEFESA
    xp: 200

  - id: matar_qualquer
    tipo: matar
    quantidade: 50
    descricao: "Matar 50 mobs (qualquer tipo)"
    coins: 300

  - id: pescar
    tipo: pescar
    quantidade: 15
    descricao: "Pescar 15 vezes"
    coins: 200

  - id: vender_plantacao
    tipo: vender
    alvos: [WHEAT, CARROT, POTATO, BEETROOT, MELON_SLICE, PUMPKIN, SUGAR_CANE]
    quantidade: 128
    descricao: "Vender 128 itens de plantação pra loja"
    coins: 200

# ---------------------------------------------------------------------------------
# MISSÕES SEMANAIS — mesmo formato do pool diário. Zeram na virada de domingo pra
# segunda. Maiores, com recompensa melhor. O progresso conta junto com as diárias
# (o mesmo bloco minerado avança uma diária e uma semanal ao mesmo tempo).
# ---------------------------------------------------------------------------------
semanais:
  ativado: true
  quantidade: 2
  bonus-todas:
    coins: 2000
    skill: DEFESA
    xp: 500
  pool:
    - id: semanal_diamante
      tipo: minerar
      alvos: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
      quantidade: 32
      descricao: "Minerar 32 minérios de diamante"
      coins: 2500

    - id: semanal_mobs
      tipo: matar
      quantidade: 300
      descricao: "Matar 300 mobs (qualquer tipo)"
      coins: 2000
      skill: ESPADAS
      xp: 800

    - id: semanal_boss
      tipo: dano_boss
      quantidade: 500
      descricao: "Causar 500 de dano no boss mundial"
      coins: 3000

    - id: semanal_vender
      tipo: vender
      quantidade: 2000
      descricao: "Vender 2000 itens pra loja"
      coins: 2000

    - id: semanal_pescar
      tipo: pescar
      quantidade: 100
      descricao: "Pescar 100 vezes"
      coins: 1500
