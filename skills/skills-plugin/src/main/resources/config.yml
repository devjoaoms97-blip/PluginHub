# Escavador: XP por bloco de "blocos" quebrado à mão nos "mundos" (bloco colocado por jogador não conta).
# ~3.000 blocos/h com pá boa: 1 XP cada. A cada bloco, chance de relíquia (0.00002 por nível = 0,1% no 50,
# ~3 por hora), de Fragmento Arcano e de mapa do tesouro comum (0.0000067 por nível cada = ~1 por hora no
# 50). A raridade da relíquia sai por faixa de nível (vale a do maior "nivel" alcançado); o item, pelo peso,
# dentro da raridade. Vendem com /trofeus vender. No 50, ~R$ 15 mil/h em relíquias.
escavador:
  xp-por-bloco: 1
  mundos: [recursos, recursos_nether]
  blocos: [DIRT, GRASS_BLOCK, COARSE_DIRT, ROOTED_DIRT, PODZOL, MYCELIUM, DIRT_PATH, MUD, CLAY, SAND, RED_SAND, GRAVEL,
           SOUL_SAND, SOUL_SOIL, SUSPICIOUS_SAND, SUSPICIOUS_GRAVEL]
  chance-achado-por-nivel: 0.00002
  chance-fragmento-por-nivel: 0.0000067
  chance-mapa-por-nivel: 0.0000067
  pesos-raridade:
    - {nivel: 1, comum: 75, raro: 22, epico: 3, lendario: 0}
    - {nivel: 25, comum: 58, raro: 30, epico: 10, lendario: 2}
    - {nivel: 50, comum: 45, raro: 32, epico: 17, lendario: 6}
  reliquias:
    moeda: {nome: "&7Moeda Antiga", material: GOLD_NUGGET, raridade: comum, preco: 1500, peso: 50}
    caco: {nome: "&7Caco de Cerâmica", material: BRICK, raridade: comum, preco: 1200, peso: 50}
    fossil: {nome: "&9Fóssil", material: BONE, raridade: raro, preco: 4000, peso: 50}
    flecha: {nome: "&9Ponta de Flecha Antiga", material: FLINT, raridade: raro, preco: 3500, peso: 50}
    amuleto: {nome: "&5Amuleto Esquecido", material: HEART_OF_THE_SEA, raridade: epico, preco: 10000, peso: 50}
    calice: {nome: "&5Cálice de Ouro", material: GOLDEN_CARROT, raridade: epico, preco: 9000, peso: 50}
    coroa: {nome: "&6Coroa Perdida", material: GOLDEN_HELMET, raridade: lendario, preco: 30000, peso: 50}
    ovo: {nome: "&6Ovo de Dinossauro", material: TURTLE_EGG, raridade: lendario, preco: 25000, peso: 50}

# Alquimista: XP por poção pronta (com efeito: água, estranha, mundana e espessa não contam) tirada do
# suporte (~360/h com vários suportes: 10 XP cada). Quem mexeu no suporte por último ganha, quando ele
# termina, a poção mais longa (0.006 por nível = +30% no 50) e a chance de uma poção a mais, que pula do
# suporte (0.003 por nível = 15% no 50).
alquimista:
  xp-por-pocao: 10
  duracao-por-nivel: 0.006
  chance-pocao-extra-por-nivel: 0.003

# Ferreiro: XP pelo que se gasta nas oficinas (OficinasPlugin): por real no Ferreiro (reparo, Adaga), na
# Bruxa (taxa) e nas coins do Cambista; por nível de XP gasto na mesa da Bruxa; por Fragmento Arcano gasto
# no Cambista. Desconto nesses três (por cima do VIP): 0.005 por nível = 25% no 50, até "desconto-maximo".
ferreiro:
  xp-por-real: 0.1
  xp-por-nivel-bruxa: 100
  xp-por-fragmento: 400
  desconto-por-nivel: 0.005
  desconto-maximo: 0.5
