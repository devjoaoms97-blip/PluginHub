# Configuração do SkillsPlugin
# Todos os valores aqui podem ser ajustados sem precisar recompilar o plugin.

nivel-maximo: 50

xp:
  # XP necessário para o nível N = base * (N ^ expoente)
  base: 50
  expoente: 1.6
  # Dano contra mobs (PvE) vale essa fração do XP que valeria contra jogador (PvP)
  multiplicador-pve: 0.5
  # Multiplicador de XP ganho por ponto de dano causado, nas skills de arma
  xp-por-dano: 2.0

recompensa:
  # Dinheiro dado ao subir de nível = nivel-novo * este valor
  dinheiro-por-nivel: 25

# XP em dobro (ou outro multiplicador) nos dias fixos abaixo. A staff também liga na hora com
# /skills admin xpdobro <multiplicador> <horas>. Vale pro XP de combate, das missões e do boss
# (por cima do bônus do VIP). Começo e fim são anunciados no chat.
xp-dobro:
  ativado: true
  multiplicador: 2.0
  dias: [SABADO, DOMINGO]

vip-bonus-xp:
  # XP a mais em todas as skills por permissão (vale o maior que o jogador tiver). O VipPlugin
  # dá essas permissões pelos grupos do LuckPerms. Também vale pro XP das missões e do bônus
  # de ativação do VIP. É uma LISTA de propósito: chave com ponto viraria seção aninhada.
  ativado: true
  permissoes:
    - permissao: "vip.xp.diamante"
      percentual: 50
    - permissao: "vip.xp.ouro"
      percentual: 30
    - permissao: "vip.xp.prata"
      percentual: 20
    - permissao: "vip.xp.bronze"
      percentual: 10

# Taxa de bônus por nível de cada skill (fração, ex: 0.005 = 0,5% por nível)
bonus-por-nivel:
  espadas: 0.005
  machado: 0.004
  arqueiro: 0.005
  porradeiro: 0.006
  tridente: 0.005
  lanceiro: 0.005
  marreteiro: 0.005
  esquiva: 0.004
  defesa: 0.003
  bloqueio: 0.004
  regeneracao: 0.01
  agilidade: 0.002

critico:
  chance-por-nivel: 0.002
  multiplicador-dano: 0.40

tridente:
  chance-empurrao-por-nivel: 0.002
  forca-empurrao: 1.4

lanceiro:
  chance-sangramento-por-nivel: 0.002
  sangramento-duracao-segundos: 4
  sangramento-dano-por-tick: 2.0

marreteiro:
  chance-atordoar-por-nivel: 0.002
  atordoar-duracao-segundos: 3

porradeiro:
  # Chance de aplicar Lentidão breve por nível
  chance-atordoar-por-nivel: 0.002
  atordoar-ticks: 20
  atordoar-amplificador: 3

passivas:
  # Intervalo (em segundos) entre concessões de XP passivo (Regeneração/Agilidade)
  intervalo-segundos: 10
  xp-por-tick: 3.0
