# Configuração do SkillsPlugin
# Todos os valores aqui podem ser ajustados sem precisar recompilar o plugin.

nivel-maximo: 50

xp:
  # XP necessário para o nível N = base * (N ^ expoente)
  base: 50
  expoente: 1.6
  # Dano contra mobs (PvE) vale essa fração do XP que valeria contra jogador (PvP)
  multiplicador-pve: 0.5
  # Em PvP, o XP contra cada vítima diminui por faixas e respeita o teto abaixo.
  # O total por dupla atacante/vítima zera à meia-noite no fuso horário do servidor.
  pvp:
    limite-diario-por-vitima: 1000.0
    faixa-xp-integral: 250.0
    faixa-xp-meia: 500.0
    multiplicador-meia: 0.5
    multiplicador-reduzido: 0.25
  # Mob da pilha de um spawner (SpawnersPlugin) vale essa fração do XP de PvE.
  multiplicador-spawner: 0.25
  # Multiplicador de XP ganho por ponto de dano causado, nas skills de arma
  xp-por-dano: 2.0

recompensa:
  # Dinheiro dado ao subir de nível = nivel-novo * este valor
  dinheiro-por-nivel: 25

# XP em dobro (ou outro multiplicador) nos dias fixos abaixo. A staff também liga na hora com
# /skills admin xpdobro <multiplicador> <horas>. Vale pro XP de combate, das missões e do boss
# (por cima do bônus do VIP). Começo e fim são anunciados no chat.
xp-dobro:
  ativado: true
  multiplicador: 2.0
  dias: [SABADO, DOMINGO]

vip-bonus-xp:
  # XP a mais em todas as skills por permissão (vale o maior que o jogador tiver). O VipPlugin
  # dá essas permissões pelos grupos do LuckPerms. Também vale pro XP das missões e do bônus
  # de ativação do VIP. É uma LISTA de propósito: chave com ponto viraria seção aninhada.
  ativado: true
  permissoes:
    - permissao: "vip.xp.diamante"
      percentual: 50
    - permissao: "vip.xp.ouro"
      percentual: 30
    - permissao: "vip.xp.prata"
      percentual: 20
    - permissao: "vip.xp.bronze"
      percentual: 10

# Taxa de bônus por nível de cada skill (fração, ex: 0.005 = 0,5% por nível)
bonus-por-nivel:
  espadas: 0.005
  machado: 0.004
  arqueiro: 0.005
  porradeiro: 0.006
  tridente: 0.005
  lanceiro: 0.005
  marreteiro: 0.005
  esquiva: 0.004
  defesa: 0.003
  bloqueio: 0.004
  regeneracao: 0.01
  agilidade: 0.002

critico:
  chance-por-nivel: 0.002
  multiplicador-dano: 0.40

tridente:
  chance-empurrao-por-nivel: 0.002
  forca-empurrao: 1.4

lanceiro:
  chance-sangramento-por-nivel: 0.002
  sangramento-duracao-segundos: 4
  sangramento-dano-por-tick: 2.0

# Prestígio (/skills prestigio <skill>): no nível máximo, a skill volta pro 1 e cada prestígio
# deixa tudo o que ela dá (bônus e chances) essa fração mais forte. Ex: prestígio 3 = +30%.
prestigio:
  maximo: 5
  bonus-por-prestigio: 0.10

# Escudo Perfeito (parry): escudo levantado no máximo janela-ticks antes de um golpe corpo a corpo
# anula o dano e atordoa quem bateu (sem andar e sem golpe corpo a corpo). Boss não fica atordoado.
parry:
  ativado: true
  # 20 ticks = 1 s. O escudo do jogo só começa a bloquear com 5 ticks levantado.
  janela-ticks: 6
  # +1 tick de janela a cada 10 níveis de Bloqueio
  janela-ticks-por-10-niveis: 1
  atordoar-segundos: 1
  # tempo até o próximo parry valer, pra subir e descer o escudo sem parar não virar imunidade
  recarga-segundos: 3
  xp-bloqueio: 15

marreteiro:
  chance-atordoar-por-nivel: 0.002
  atordoar-duracao-segundos: 3

porradeiro:
  # Chance de aplicar Lentidão breve por nível
  chance-atordoar-por-nivel: 0.002
  atordoar-ticks: 20
  atordoar-amplificador: 3

passivas:
  # Intervalo (em segundos) entre concessões de XP passivo (Regeneração/Agilidade)
  intervalo-segundos: 10
  xp-por-tick: 3.0

# ---------------------------------------------------------------------------------------------
# Skills de profissão (fora do PvP). Os números saíram do tools/economia/simular.py (2026-11-02):
# chance = nível x "por-nivel" (o prestígio soma 10% por prestígio, como nas outras skills).
# ---------------------------------------------------------------------------------------------

# Minerador: XP por bloco quebrado à mão numa mina (RankupPlugin). Com 1, chega ao nível ~45 quando
# vira Rei. Com picareta, chance de quebrar o 3x3 em volta (o plano de frente pra quem minera): 0.001
# por nível = 5% no nível 50, o que encurta a meta de 150 h pra ~133 h (simular.py --minerador 0.05).
# Os blocos extras só vão pra venda automática da mina: não dão fragmento, mapa, missão nem XP.
minerador:
  xp-por-bloco: 1
  chance-3x3-por-nivel: 0.001

# Agricultor: XP por planta madura colhida com a mão (trigo, cenoura, batata, beterraba, verruga do
# Nether e cacau); farm automática não dá. Bônus de venda nas categorias da loja abaixo (o Fazendeiro),
# 0.004 por nível = +20% no 50, por cima do rank e do VIP e abaixo da trava da venda. Chance de
# colheita dupla (só o que se colhe, não a semente), 0.003 por nível = 15% no 50.
agricultor:
  xp-por-colheita: 3
  bonus-venda-por-nivel: 0.004
  categorias-venda: [Farm]
  chance-colheita-dupla-por-nivel: 0.003

# Pescador: XP por pesca (pesca parada vale). No nível 50, 1 em 400 pescas dá um mapa do tesouro
# (TesourosPlugin) e 1 em 400 um Fragmento Arcano (RankupPlugin): ~1 de cada por hora com a vara de
# Isca III (~400 pescas por hora). Abaixo do 50 a chance cai junto com o nível, e os pesos do mapa
# puxam pro Comum (vale a faixa do maior "nivel" que o jogador já tem). Tabela: simular.py --pescador.
pescador:
  xp-por-pesca: 8
  chance-mapa-por-nivel: 0.00005
  chance-fragmento-por-nivel: 0.00005
  pesos-mapa:
    - {nivel: 1, comum: 85, raro: 15, arcano: 0, lendario: 0}
    - {nivel: 10, comum: 75, raro: 20, arcano: 5, lendario: 0}
    - {nivel: 20, comum: 65, raro: 24, arcano: 9, lendario: 2}
    - {nivel: 30, comum: 55, raro: 28, arcano: 13, lendario: 4}
    - {nivel: 40, comum: 50, raro: 29, arcano: 16, lendario: 5}
    - {nivel: 50, comum: 45, raro: 30, arcano: 18, lendario: 7}
  # Loot próprio da pesca (2026-11-10). A cada pesca, chance de vir uma pesca especial no lugar do
  # que o anzol puxou: chance-base + chance-por-nivel × nível do Pescador (com o prestígio). Nível 1:
  # 2,1%, nível 50: 7% (~1 em 14). A Vara do Pescador multiplica por 1 + vara.bonus-chance.
  # Pesca parada: do mesmo bloco e sem mexer a câmera há mais de afk.minutos, a chance vezes afk.fator.
  # A raridade sai pela faixa de nível (pesos-raridade) e o item, pelo peso, da lista da raridade. Cada
  # item é: peixe:<id>, bau:<comum|raro|lendario>, vara, adaga, fragmento, combustivel,
  # spawner:<tipo>, maquina:<tipo>, livro:<encantamento>:<nível> ou um MATERIAL; qtd: [mín, máx].
  # Pra mudar, copie o bloco "loot" inteiro pro config do servidor (as listas não se misturam com as do jar).
  # Renda pescando ativo (~300 pescas/h), entre peixes e baús: nível 1 ~R$ 5 mil/h, 25 ~R$ 21 mil/h,
  # 50 ~R$ 58 mil/h e 1,3 fragmento/h. Parado no 50 (400 pescas/h, fator 0.25): ~R$ 19 mil/h.
  loot:
    ativado: true
    chance-base: 0.02
    chance-por-nivel: 0.001
    afk:
      minutos: 10
      fator: 0.25
    pesos-raridade:
      - {nivel: 1, comum: 80, raro: 18, epico: 2, lendario: 0}
      - {nivel: 10, comum: 70, raro: 24, epico: 5, lendario: 1}
      - {nivel: 20, comum: 62, raro: 27, epico: 9, lendario: 2}
      - {nivel: 30, comum: 55, raro: 29, epico: 12, lendario: 4}
      - {nivel: 40, comum: 50, raro: 30, epico: 15, lendario: 5}
      - {nivel: 50, comum: 45, raro: 30, epico: 18, lendario: 7}
    raridades:
      comum:
        itens:
          lambari: {item: "peixe:lambari", peso: 45}
          bau: {item: "bau:comum", peso: 20}
          combustivel: {item: combustivel, qtd: [8, 16], peso: 15}
          xp: {item: EXPERIENCE_BOTTLE, qtd: [4, 8], peso: 10}
          inquebravel: {item: "livro:unbreaking:3", peso: 5}
          isca: {item: "livro:lure:3", peso: 5}
      raro:
        itens:
          tucunare: {item: "peixe:tucunare", peso: 40}
          bau: {item: "bau:raro", peso: 20}
          combustivel: {item: combustivel, qtd: [32, 64], peso: 12}
          remendo: {item: "livro:mending:1", peso: 6}
          afiacao: {item: "livro:sharpness:5", peso: 6}
          vara: {item: vara, peso: 6}
          fragmento: {item: fragmento, peso: 5}
          maca: {item: GOLDEN_APPLE, qtd: [2, 4], peso: 5}
      epico:
        itens:
          pirarucu: {item: "peixe:pirarucu", peso: 35}
          bau: {item: "bau:raro", peso: 15}
          bau-lendario: {item: "bau:lendario", peso: 5}
          vara: {item: vara, peso: 10}
          sucata: {item: NETHERITE_SCRAP, qtd: [1, 2], peso: 10}
          totem: {item: TOTEM_OF_UNDYING, peso: 6}
          fragmento: {item: fragmento, peso: 6}
          slime: {item: "spawner:slime", peso: 5}
          tridente: {item: TRIDENT, peso: 8}
      lendario:
        itens:
          brasa: {item: "peixe:brasa", peso: 30}
          bau: {item: "bau:lendario", peso: 25}
          adaga: {item: adaga, peso: 10}
          maca: {item: ENCHANTED_GOLDEN_APPLE, peso: 8}
          fragmento: {item: fragmento, qtd: [2, 3], peso: 8}
          blaze: {item: "spawner:blaze", peso: 8}
          netherite: {item: NETHERITE_INGOT, peso: 7}
          lapidadora: {item: "maquina:lapidadora", peso: 4}
    # Peixes raros: vendidos com /peixes vender pelo preço daqui (a loja não compra).
    peixes:
      lambari:
        material: COD
        nome: "&eLambari Dourado"
        descricao: ["&7Brilha como moeda nova."]
        preco: 300
      tucunare:
        material: SALMON
        nome: "&6Tucunaré Brasa"
        descricao: ["&7Briga até o último segundo."]
        preco: 1500
      pirarucu:
        material: SALMON
        nome: "&5Pirarucu Arcano"
        descricao: ["&7Gigante dos rios, cheio de magia."]
        preco: 6000
      brasa:
        material: TROPICAL_FISH
        nome: "&c&lPeixe-Brasa"
        descricao: ["&7Dizem que nada no fogo.", "&7Poucos já viram um."]
        preco: 25000
    # Baú do Mar: clique direito abre. Coins entre o mínimo e o máximo e "rolagens" itens, sem repetir.
    bau:
      comum:
        nome: "&bBaú do Mar"
        coins: [800, 2000]
        rolagens: 1
        itens:
          ferro: {item: IRON_INGOT, qtd: [8, 16], peso: 30}
          combustivel: {item: combustivel, qtd: [8, 16], peso: 25}
          maca: {item: GOLDEN_APPLE, qtd: [1, 2], peso: 20}
          lambari: {item: "peixe:lambari", peso: 20}
          isca: {item: "livro:lure:3", peso: 5}
      raro:
        nome: "&9Baú do Mar Raro"
        coins: [4000, 8000]
        rolagens: 2
        itens:
          diamante: {item: DIAMOND, qtd: [3, 6], peso: 25}
          combustivel: {item: combustivel, qtd: [32, 64], peso: 20}
          tucunare: {item: "peixe:tucunare", peso: 15}
          remendo: {item: "livro:mending:1", peso: 10}
          vara: {item: vara, peso: 10}
          xp: {item: EXPERIENCE_BOTTLE, qtd: [16, 32], peso: 15}
          fragmento: {item: fragmento, peso: 5}
      lendario:
        nome: "&6&lBaú do Mar Lendário"
        coins: [25000, 40000]
        rolagens: 3
        itens:
          diamante: {item: DIAMOND_BLOCK, qtd: [2, 4], peso: 20}
          pirarucu: {item: "peixe:pirarucu", peso: 15}
          netherite: {item: NETHERITE_INGOT, peso: 10}
          maca: {item: ENCHANTED_GOLDEN_APPLE, peso: 10}
          fragmento: {item: fragmento, qtd: [1, 2], peso: 10}
          adaga: {item: adaga, peso: 8}
          blaze: {item: "spawner:blaze", peso: 8}
          golem: {item: "spawner:golem", peso: 4}
          lapidadora: {item: "maquina:lapidadora", peso: 5}
    # Vara do Pescador: sai no loot (raro e épico) e no Baú do Mar Raro.
    vara:
      nome: "&b&lVara do Pescador"
      bonus-chance: 0.25
      encantamentos: {luck_of_the_sea: 3, lure: 3, unbreaking: 3, mending: 1}

# Lenhador: XP por tronco cortado com a mão (tronco colocado por jogador não conta). Chance de uma
# tora a mais (na mina do bosque também), 0.004 por nível = 20% no 50. Com machado, chance de derrubar
# a árvore inteira, só nos mundos abaixo e só em árvore natural (troncos ligados a folhas que não
# foram colocadas), até "derrubar-max-troncos". Na mina nunca: lá é tudo tronco, sem folha.
lenhador:
  xp-por-tronco: 3
  chance-tora-extra-por-nivel: 0.004
  chance-derrubar-por-nivel: 0.004
  derrubar-mundos: [recursos]
  derrubar-max-troncos: 64
