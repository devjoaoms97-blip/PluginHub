# Minas usadas na simulação (simular.py). Mesma ideia do /mina admin bloco: bloco e peso.
# Não é lido pelo plugin: as minas de verdade ficam no minas.yml do servidor. Quando montar
# as minas no jogo, use estas composições (ou mude aqui e rode a simulação de novo).
# Calibradas pra cada mina render cerca de 1,6x a anterior (3 jogadores por mina, sem fortuna).
minas:
  pedreira:
    rank: campones
    blocos: {stone: 80, coal_ore: 20}
  cobre:
    rank: fazendeiro
    blocos: {stone: 77, coal_ore: 17, copper_ore: 6}
  bosque:
    rank: lenhador
    blocos: {oak_log: 50, spruce_log: 50}
  ferro:
    rank: ferreiro
    blocos: {stone: 55, iron_ore: 30, coal_ore: 15}
  ouro:
    rank: mercador
    blocos: {stone: 57, gold_ore: 18, iron_ore: 25}
  redstone:
    rank: escudeiro
    blocos: {deepslate: 10, deepslate_redstone_ore: 30, deepslate_lapis_ore: 60}
  ametista:
    rank: clerigo
    blocos: {amethyst_block: 60, deepslate_lapis_ore: 40}
  diamante:
    rank: cavaleiro
    blocos: {deepslate: 55, deepslate_diamond_ore: 45}
  esmeralda:
    rank: barao
    blocos: {deepslate: 50, deepslate_emerald_ore: 25, deepslate_diamond_ore: 25}
  nether:
    rank: conde
    blocos: {netherrack: 35, nether_quartz_ore: 35, nether_gold_ore: 20, ancient_debris: 10}
  blocos:
    rank: duque
    blocos: {iron_block: 50, gold_block: 50}
  tesouro:
    rank: rei
    blocos: {iron_block: 75, diamond_block: 15, emerald_block: 5, ancient_debris: 5}
