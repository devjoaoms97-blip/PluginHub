    blocos: {oak_log: 50, spruce_log: 50}
  ferro:
    rank: ferreiro
    blocos: {stone: 55, iron_ore: 30, coal_ore: 15}
  ouro:
    rank: mercador
    blocos: {stone: 63, gold_ore: 12, iron_ore: 25}
  redstone:
    rank: escudeiro
    blocos: {deepslate: 30, deepslate_redstone_ore: 25, deepslate_lapis_ore: 45}
  ametista:
    rank: clerigo
    blocos: {amethyst_block: 60, deepslate_lapis_ore: 40}
  diamante:
    rank: cavaleiro
    blocos: {deepslate: 62, deepslate_diamond_ore: 38}
  esmeralda:
    rank: barao
    blocos: {deepslate: 60, deepslate_emerald_ore: 18, deepslate_diamond_ore: 22}
