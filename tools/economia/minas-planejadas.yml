# Minas usadas na simulação (simular.py). Mesma ideia do /mina admin bloco: bloco e peso.
# Não é lido pelo plugin: as minas de verdade ficam no minas.yml do servidor. Quando montar
# as minas no jogo, use estas composições (ou mude aqui e rode a simulação de novo).
# Calibradas pra cada mina render cerca de 1,6x a anterior (3 jogadores por mina, Fortuna III).
