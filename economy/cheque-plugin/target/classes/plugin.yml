name: ChequePlugin
version: '1.0.0'
main: com.example.cheque.ChequePlugin
api-version: '26.2'
author: Você
description: Cheques emitidos numa folha de cheque e depositados no Bancário, e a Mine-sena, a loteria do Bancário (via Vault).
softdepend: [Vault, PixPlugin, DiscordPlugin]

commands:
  cheque:
    description: Transforma a folha de cheque que você segura em um cheque.
    usage: "Uso correto: /cheque <valor> [jogador] | /cheque cancelar [id]"
    permission: cheque.criar
    permission-message: "§cVocê não tem permissão para criar cheques."

  minesena:
    description: Mostra o pote, o horário e os seus bilhetes da Mine-sena (staff sorteia na hora).
    usage: "Uso: /minesena | /minesena sortear [número]"

permissions:
  cheque.criar:
    description: Permite emitir cheques (com uma folha de cheque na mão).
    default: true
  cheque.limite.ignorar:
    description: Emite cheques sem o valor máximo nem o intervalo entre emissões.
    default: false
  cheque.admin:
    description: Cancela qualquer cheque, inclusive pelo ID (/cheque cancelar <id>).
    default: op
  cheque.resgatar:
    description: Permite depositar cheques no Bancário.
    default: true
