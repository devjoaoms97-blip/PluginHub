# Configuração do ChequePlugin
# Toda emissão e resgate fica em plugins/ChequePlugin/cheques.log, e um cheque com ID já
# resgatado (cópia) é recusado e anulado.

# Banco (o NPC Bancário do OficinasPlugin): vende a folha de cheque em branco (sem ela ninguém
# emite) e é onde o cheque vira dinheiro. O depósito cobra a taxa de compensação (igual à do Pix,
# senão o cheque seria um Pix sem taxa); a taxa e a folha somem da economia.
banco:
  preco-folha: 50
  taxa-deposito-percentual: 1.0
  # Quantas movimentações o extrato (o livro que o Bancário entrega) mostra, da mais nova pra mais velha.
  extrato-transacoes: 30

# Mine-sena: a loteria do Bancário. O jogador escolhe um número de 1 a numero-maximo e compra o
# bilhete no balcão. Todo dia no horario (hora do servidor) sai o número premiado, e o pote inteiro
# (todas as apostas acumuladas) é dividido entre os bilhetes com esse número. Sem ganhador, acumula.
# A staff sorteia na hora com /minesena sortear [número].
minesena:
  ativado: true
  preco-bilhete: 500
  numero-maximo: 100
  horario: "18:00"
  # Bilhetes de um jogador pro mesmo sorteio. 0 = sem limite.
  maximo-bilhetes-por-jogador: 20

limite:
  # Valor máximo de um cheque. 0 desativa.
  valor-maximo: 1000000
  # Segundos entre uma emissão e outra do mesmo jogador. 0 desativa.
  cooldown-segundos: 10
  # Quem tem a permissão cheque.limite.ignorar não tem nenhum dos dois limites.
