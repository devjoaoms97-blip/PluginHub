mensagens:
  # Quem não é da staff e usa /shop.
  loja-presencial: "&eA loja é presencial: vá à &6Loja Oficial&e, no portão LESTE do spawn (&f/warp loja&e)."
  # Quem tenta trocar com um villager (ver bloquear-trocas-villager).
  trocas-villager: "&cAs trocas com villager estão desligadas: compre e venda na &6Loja Oficial &c(&f/warp loja&c)."

# Ninguém troca com villager nem com o vendedor ambulante, no servidor todo: esmeralda por item
# passaria por fora da loja e dos preços dinâmicos.
bloquear-trocas-villager: true

eventos-mercado:
  # De tempos em tempos (intervalo-horas), com a chance abaixo, um item da lista fica "em alta":
  # a loja paga um multiplicador (sorteado entre o mínimo e o máximo) na venda dele, por
  # duracao-horas. Anunciado no chat no começo e no fim. A staff liga na hora com
  # /shop admin evento <item> <multiplicador> <horas>. "MATERIAL:nome no anúncio".
  ativado: true
  intervalo-horas: 6
  chance: 50
  duracao-horas: 2
  multiplicador-minimo: 1.5
  multiplicador-maximo: 2.0
  itens:
    - "DIAMOND:diamante"
    - "EMERALD:esmeralda"
    - "GOLD_INGOT:ouro"
    - "IRON_INGOT:ferro"
    - "REDSTONE:redstone"
    - "LAPIS_LAZULI:lápis-lazúli"
    - "COAL:carvão"
    - "COPPER_INGOT:cobre"
    - "QUARTZ:quartzo"
    - "AMETHYST_SHARD:ametista"
