# Configuração da Loja Dinâmica

regeneracao:
  # A cada quantos segundos o preço de venda tenta se recuperar um pouco em direção à âncora
  intervalo-segundos: 60
  # Fração da distância até a âncora recuperada a cada intervalo (0.02 = 2% mais perto por vez)
  fator-por-tick: 0.02

# Quantidade máxima permitida numa única transação de /sell ou /buy, pra evitar
# comandos absurdos acidentais (ex: vender 999999 de uma vez por engano)
limite-por-transacao: 6400

imposto:
  # Percentual descontado de toda venda (o dinheiro simplesmente some, não vai pra ninguém —
  # ajuda a controlar inflação no servidor). 0 desativa.
  percentual-venda: 2.0

historico:
  # A cada quantos minutos tira uma "foto" do preço de venda de cada item, pro gráfico de /shop historico
  intervalo-minutos: 15

integracao:
  # Se true e o PixPlugin estiver instalado, toda compra/venda também aparece no /pix historico do jogador
  pix: true

vip-descontos:
  # Desconto na compra (/buy) por permissão — desacoplado do VipPlugin, funciona com qualquer
  # plugin de permissões. Se o VipPlugin estiver instalado, ele já concede automaticamente o
  # grupo do LuckPerms certo pro tier do jogador; quem decide se esse grupo tem a permissão
  # abaixo é o próprio LuckPerms (configure isso ao configurar os grupos vip_bronze/vip_prata/
  # vip_ouro/vip_diamante — veja o README do vip-plugin).
  #
  # IMPORTANTE: é uma LISTA, não um mapa de "permissao: percentual" — chaves com ponto (tipo
  # "vip.desconto.diamante") viram seção aninhada quando o Bukkit carrega YAML, então um mapa
  # quebraria silenciosamente. Deixa nesse formato de lista mesmo.
  ativado: true
  permissoes:
    - permissao: "vip.desconto.diamante"
      percentual: 20
    - permissao: "vip.desconto.ouro"
      percentual: 15
    - permissao: "vip.desconto.prata"
      percentual: 10
    - permissao: "vip.desconto.bronze"
      percentual: 5

