name: PixPlugin
version: '1.0.0'
main: com.example.pix.PixPlugin
api-version: '26.2'
author: Você
description: Sistema de pagamentos e cobranças entre jogadores (Pix), via Vault.
softdepend: [Vault, DiscordPlugin]

commands:
  pix:
    description: Sistema de pagamentos entre jogadores.
    usage: "Uso: /pix <pagar|receber|aceitar|recusar|pendentes|cancelar|historico|qrcode|limite|agendar|agendamentos|chave>"
    permission: pix.usar
    permission-message: "§cVocê não tem permissão para usar o Pix."

permissions:
  pix.usar:
    description: Permite usar o sistema de Pix.
    default: true
  pix.admin:
    description: "Permite recarregar a configuração do Pix (ex: taxa de transação) e zerar limites diários."
    default: op
  pix.alertas:
    description: Recebe no chat os alertas de Pix suspeito.
    default: op
  pix.limite.ignorar:
    description: Não tem limite diário de transferência.
    default: op
