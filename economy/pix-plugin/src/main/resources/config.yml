# Configuração do PixPlugin

taxa:
  # Percentual descontado de cada transação entre jogadores (/pix pagar e cobranças aceitas
  # via /pix aceitar). O valor da taxa simplesmente desaparece da economia — não vai pra
  # ninguém, nem pro "caixa" de ninguém — funcionando como mais um sink pra ajudar a
  # controlar a inflação do servidor. 0 desativa.
  percentual-transacao: 1.0

  # Valor mínimo de taxa cobrado por transação, na moeda do servidor. Evita que pagamentos
  # de centavos passem sem custo nenhum por causa de arredondamento. 0 desativa esse piso
  # (a taxa mínima nunca é maior que o próprio valor da transação).
  minimo: 0.0

  # Desconto na taxa pra quem PAGA, por permissão (vale o maior). Os grupos de VIP do
  # LuckPerms já têm essas permissões (as mesmas do desconto da loja). É uma LISTA de propósito:
  # chave com ponto viraria seção aninhada.
  vip-descontos:
    ativado: true
    permissoes:
      - permissao: "vip.desconto.diamante"
        percentual: 80
      - permissao: "vip.desconto.ouro"
        percentual: 60
      - permissao: "vip.desconto.prata"
        percentual: 40
      - permissao: "vip.desconto.bronze"
        percentual: 20

discord:
  # Pix a partir desse valor vai pro Discord da staff (categoria "pix" do DiscordPlugin), pra
  # conferir conta roubada sendo esvaziada ou lavagem entre contas. 0 desliga.
  pix-suspeito-valor: 100000

alertas:
  # Além do Pix alto (discord.pix-suspeito-valor), avisa a staff (chat de quem tem pix.alertas,
  # Discord "pix" e plugins/PixPlugin/alertas.log) quando:
  # - um envio deixa o pagador com essa % do limite diário ou mais (só com limite.diario ligado). 0 desliga;
  perto-do-limite-percentual: 90
  # - uma conta que entrou pela primeira vez há menos de conta-nova-horas recebe de
  #   remetentes-distintos contas diferentes em 24 h. 0 em qualquer um desliga.
  conta-nova-horas: 48
  remetentes-distintos: 3

notificacao:
  # Quem recebe um Pix (pagamento, cobrança aceita ou agendado) ganha um título na tela com o
  # valor e um som, além da mensagem no chat.
  titulo: true
  som: true

limite:
  # Máximo que cada jogador pode ENVIAR por dia via Pix (/pix pagar, /pix aceitar e os
  # botões do /pix qrcode), somando o valor bruto antes da taxa. Zera à meia-noite (horário
  # do servidor) e sobrevive a reinícios. Serve pra frear fraude/lavagem entre contas
  # (ex: conta roubada esvaziada de uma vez). 0 desativa. Quem tem a permissão
  # pix.limite.ignorar (ex: staff) não tem limite.
  diario: 0

agendamento:
  # /pix agendar <jogador> <valor> <dias>: o primeiro pagamento sai na hora, os próximos a cada
  # N dias, sozinhos, com as mesmas regras do /pix pagar (saldo, limite diário e taxa).
  maximo-por-jogador: 5
  dias-maximo: 30
  # Sem saldo ou sem limite, tenta de novo a cada hora; depois de tantas falhas seguidas, cancela.
  falhas-maximas: 3
