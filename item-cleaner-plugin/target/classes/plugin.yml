name: ItemCleanerPlugin
version: '1.0.0'
main: com.example.itemcleaner.ItemCleanerPlugin
api-version: '26.2'
author: Você
description: Limpa periodicamente itens dropados no chão pra reduzir lag, com aviso em contagem regressiva e achados e perdidos.
softdepend: [Vault]

commands:
  limparchao:
    description: Limpa itens do chão manualmente, ou mostra/recarrega a limpeza automática.
    usage: "Uso: /limparchao [agora|status|reload]"
    permission: itemcleaner.admin
    permission-message: "§cVocê não tem permissão para gerenciar a limpeza de itens."

  achados:
    description: Abre os seus achados e perdidos (o que a limpeza tirou do chão e era seu).
    usage: "Uso: /achados"
    aliases: [perdidos]
    permission: itemcleaner.achados

permissions:
  itemcleaner.achados:
    description: Usa os achados e perdidos.
    default: true
  itemcleaner.admin:
    description: Permite gerenciar a limpeza automática de itens no chão.
    default: op
