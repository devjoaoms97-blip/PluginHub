# Configuração da Limpeza Automática de Itens no Chão

# A cada quantos segundos a limpeza automática roda.
intervalo-segundos: 300

# Em quais segundos antes da limpeza os jogadores recebem aviso no chat (contagem regressiva).
# Pode ter quantos avisos quiser, em qualquer ordem.
avisos-segundos: [60, 30, 10, 5]

# Não remove itens que foram renomeados (ex: na bigorna). Costuma ser sinal de que o jogador
# se importa com aquele item (troféu de evento, item guardado de propósito, etc.)
ignorar-itens-nomeados: true

# Também remove os orbes de XP soltos no chão.
limpar-orbes-xp: true

# Não remove nada num raio de tantos blocos de qualquer jogador (o drop de quem está minerando ou
# lutando ali do lado fica). 0 desativa.
protecao-perto-de-jogador: 8

# /limparchao (sem argumento): espera tantos segundos depois do aviso antes de limpar.
aviso-manual-segundos: 10

# Achados e perdidos: o item com dono (jogado por um jogador, ou que caiu do corpo dele) que a
# limpeza tiraria do chão vai pra caixa desse jogador (/achados), em vez de sumir. Cada pilha volta
# pagando taxa-por-pilha (as coins somem da economia). Guarda até maximo-por-jogador pilhas por
# "dias" dias; o que passa disso some como antes. Nos mundos-sem-caixa (as arenas, onde quem morre
# perde os itens pro vencedor) nada vai pra caixa.
achados:
  ativado: true
  taxa-por-pilha: 100
  maximo-por-jogador: 45
  dias: 3
  mundos-sem-caixa: [arenas]
  # Aviso na barra de ação quando um item vai pra caixa de quem está online.
  avisar: true

mundos:
  # "todos" limpa em todos os mundos.
  # "somente-listados" limpa só nos mundos da lista abaixo.
  # "exceto-listados" limpa em todos os mundos, menos os da lista abaixo.
  modo: todos
  lista: []

mensagens:
  # Use '&' pros códigos de cor. {segundos} e {quantidade} são substituídos automaticamente.
  aviso: "&e[Limpeza] Itens no chão serão removidos em &f{segundos}s&e! Pegue o que for importante."
  # Aviso da limpeza manual (/limparchao) pela staff.
  aviso-manual: "&e[Limpeza] A staff vai limpar os itens do chão em &f{segundos}s&e! Pegue o que for importante."
  executado: "&a[Limpeza] &f{quantidade} &aitens removidos do chão."
  # Se false, a limpeza automática continua rodando, só não avisa no chat quando termina
  # (o aviso de contagem regressiva antes de limpar continua acontecendo normalmente).
  anunciar-execucao: true
