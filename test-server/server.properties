# Chaves que o montar.bat garante no server.properties (o resto fica como o Paper gerar).
# O rcon.password é gerado na primeira montagem e não fica no repositório.
online-mode=false
server-ip=127.0.0.1
enforce-whitelist=true
# O de desenvolvimento fica na 25566 (só neste PC); a 25565, a do túnel, é do servidor dos jogadores
# (D:\BrasaMC), que roda junto.
server-port=25566
enable-rcon=true
rcon.port=25576
motd=PluginHub - servidor de teste
difficulty=normal
spawn-protection=0
max-players=10
view-distance=8
simulation-distance=8
enable-command-block=true
# Nether e End só os de recursos (RecursosPlugin: /nether e /end); o allow-end fica no bukkit.yml
allow-nether=false
