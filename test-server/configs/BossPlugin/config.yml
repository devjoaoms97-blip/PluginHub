# Configuração do Boss Mundial

# Vida/dano/escala GLOBAIS — usados por qualquer perfil de boss que não defina o
# próprio valor (veja "bosses:" mais abaixo). Cada perfil pode sobrescrever isso
# individualmente adicionando vida-maxima/dano-ataque/escala dentro dele.
# Calibrado em 2026-11-06 pra netherite com Proteção IV e Afiação V (veja o comentário dos perfis):
# 25.000 de vida são uns 6 min com 6 jogadores; o golpe de 30 tira 4,8 na netherite (2,4 corações).
# Vida acima de 1024 precisa de settings.attribute.maxHealth.max maior no spigot.yml (o montar.ps1
# põe 200000, que cobre o Wither elite).
vida-maxima: 25000
dano-ataque: 30
escala: 9.0

# Explosão do boss Creeper: dá dano SÓ em players (nada de mobs), não destrói
# blocos e o boss NÃO morre nem perde vida ao explodir. O dano cai com a distância
# (cheio no centro, zero na borda do raio).
explosao:
  raio: 8.0
  # 60 no centro: 14,7 na netherite P4 (100 matava de vida cheia)
  dano-maximo: 60.0
  cooldown-segundos: 3
  knockback: 1.0

# Os anúncios do boss (os avisos da agenda e o de quando ele aparece) ganham um botão [IR] que roda este comando.
botao-comando: "/warp boss"

mensagem-spawn: "&4&l☠ BOSS ☠ &capareceu na arena! Quem der o último golpe vira o campeão. &f/warp boss"
mensagem-vitoria: "&6&l★ &e%jogador% &6derrotou o boss e agora é o novo campeão! ★"

barra:
  cor: RED
  estilo: SEGMENTED_10

# Agenda recorrente: "DIA HH:mm" sorteia entre os bosses NÃO especiais; "DIA HH:mm <boss>" sobe
# aquele boss (o Wither, especial, só sai assim ou com /boss start wither). Dias: SEGUNDA, TERCA,
# QUARTA, QUINTA, SEXTA, SABADO, DOMINGO.
agenda:
  - "SEGUNDA 20:00"
  - "TERCA 20:00"
  - "QUARTA 20:00"
  - "QUINTA 20:00"
  - "SEXTA 20:00"
  - "SABADO 20:00"
  - "DOMINGO 20:00 wither"

# Quanto tempo o boss fica vivo (0 = até alguém derrotar). Passou disso, ele vai embora e o servidor
# fica amaldiçoado (veja "maldicao"). Vale pra agenda e pro /boss start; o /boss stop não amaldiçoa.
tempo-limite-minutos: 60

# O boss fica preso na arena: passou desse raio (em blocos, na horizontal, a partir do local do
# /boss setlocal) ou de arena-altura acima dele, volta pro centro. O piso da arena "toxica" tem raio
# 48. Também limita o teleporte de ataque a quem está dentro da arena. 0 desliga.
arena-raio: 46
arena-altura: 55
# Avisos no chat antes de ele ir embora, em minutos.
avisos-fuga-minutos: [10, 1]
mensagem-fuga: "&c&l⚠ &cO boss vai embora em &f%minutos% min&c! Se ninguém derrotar, o mal reina sobre o servidor."

# Boss que vai embora sem ser derrotado: o XP de skill de todos vale xp-skill-multiplicador (0.9 = -10%)
# por "horas", ou até o próximo boss morrer. Não mexe no bônus de ativação do VIP. %boss% e %horas%.
maldicao:
  ativado: true
  horas: 24
  xp-skill-multiplicador: 0.9
  mensagem: "&c%boss% &cnão foi derrotado e voltou pras trevas... &4O mal reina sobre o servidor pelas próximas %horas% horas! &7(XP de skill -10% até alguém derrotar o próximo boss)"
  mensagem-quebrada: "&a&l✦ &aO boss caiu e a maldição foi quebrada! &7O XP de skill voltou ao normal."
  mensagem-fim: "&7A maldição se dissipou. O XP de skill voltou ao normal."
  mensagem-entrada: "&4☠ &cO mal reina sobre o servidor: XP de skill -10% por mais %horas%h, ou até alguém derrotar o próximo boss."

# Contagem regressiva no chat antes de cada horário da agenda (não vale pro /boss start
# manual). Lista vazia desativa. %minutos% é trocado pelo tempo que falta.
aviso-agenda:
  minutos-antes: [10, 5, 1]
  mensagem: "&4&l☠ BOSS ☠ &caparece em &f%minutos% min&c! Último golpe e ranking de dano valem prêmio. &f/warp boss"

# Ranking de quem mais causou dano, anunciado no chat quando o boss morre. Conta dano
# direto e de projéteis (flecha, tridente). O campeão continua sendo quem deu o último hit.
ranking-dano:
  ativado: true
  top: 3

# Boss elite: de vez em quando (chance a cada boss aleatório da agenda ou do /boss start sem id),
# o boss vem mais forte e paga mais. /boss start [id] elite força. O dano a mais vale pra tudo que
# vem do boss (golpe, flechas, onda de choque, explosão).
elite:
  chance: 0.10
  multiplicador-vida: 2.0
  # 1,5: o golpe de 30 vira 45 (9,1 na netherite P4); a onda de 50 e a de 60 viram 75 e 90 e matam
  # de vida cheia (é o perigo do elite)
  multiplicador-dano: 1.5
  # Coins do ranking e do campeão e XP de skill por participar.
  multiplicador-recompensas: 2.0
  # Quantas vezes o loot do chão é sorteado.
  rolagens-loot: 2
  prefixo-nome: "&6&l✦ ELITE ✦ "
  barra-cor: PURPLE
  mensagem-spawn: "&6&l✦ BOSS ELITE ✦ &eapareceu na arena! Dobro de vida, dobro de dano e recompensa em dobro. &f/warp boss"

campeao:
  grupo-luckperms: "boss_campeao"

# O que o boss paga quando morre, além do loot. O dinheiro vem do servidor (entra dinheiro novo
# na economia) e precisa do Vault.
recompensas:
  # Coins pros primeiros do ranking de dano: 1º, 2º, 3º... Lista vazia desativa.
  ranking-dano: [15000, 10000, 5000]
  # Coins pro campeão (quem deu o último golpe), além do item. 0 desativa.
  campeao-dinheiro: 20000
  # XP de skill por participar: cada jogador ganha até esse XP, proporcional ao % da vida do boss
  # que tirou, na skill da arma que usou (espada, machado, arco...). 0 desativa.
  xp-skill-maximo: 3000
  # Quem bateu pelo menos um pouco ganha no mínimo isso.
  xp-skill-minimo: 100
  # Código de VIP pro campeão (gerado pelo VipPlugin, 1 uso): vitrine do VIP.
  codigo-vip:
    ativado: true
    # Só esses bosses dão o código (lista vazia = todos): o Wither, o especial de domingo.
    bosses: [wither]
    tier: bronze
    # Código de evento (3, 7 ou 15 dias, os de codigos-evento.dias-permitidos no VipPlugin): só os
    # benefícios passivos do VIP e kit diário, sem bônus de ativação nem kit mensal; não dá pra vender.
    dias: 7
    # Prazo pra resgatar (0 = não expira).
    validade-dias: 7

dificuldade:
  # Multiplicador sobre a velocidade de movimento padrão do mob (1.5 = 50% mais rápido)
  velocidade-multiplicador: 2
  # Alcance (em blocos) que o boss consegue perseguir um jogador sem perder o alvo
  alcance-perseguicao: 48
  # A cada quantos segundos o boss sorteia e dispara um ataque do próprio arsenal
  intervalo-ataque-aleatorio-segundos: 5

# ---------------------------------------------------------------------------------
# PERFIS DE BOSS — um por mob. "fases" são marcos fixos (por % de vida ou por tempo),
# disparam sempre, na ordem/condição configurada. "ataques-aleatorios" é o arsenal:
# a cada X segundos (dificuldade.intervalo-ataque-aleatorio-segundos), o boss sorteia
# UM item dessa lista e executa — cada perfil tem seu próprio arsenal temático.
#
# Ações disponíveis: invocar_mobs, efeito_area, buff_boss, mensagem, investida,
# chuva_projeteis, onda_de_choque, curar, teleporte_ataque
#
# Balanceado em 2026-11-06 pra quem chega de netherite com Proteção IV (o mínimo esperado). O que
# sobra de cada dano nessa armadura, com 20 de vida: 30 → 4,8; 36 → 6,3; 40 → 7,5; 50 → 10,8;
# 60 → 14,7; 70 → 19,2; 100 → 30 (mata). Nenhum ataque passa de 60: dói muito, mas de vida cheia
# ninguém morre de um golpe só. A flecha da chuva chega a ~1,6 de velocidade, e o dano dela é
# dano-por-projetil × velocidade (18 → 29 → 4,5). Veneno não mata (para em meio coração); Wither
# mata e passa por cima da armadura (nível II: 1 de vida/s; III: 2/s).
# ---------------------------------------------------------------------------------
bosses:

  zombie:
    mob: ZOMBIE
    nome: "&4&l☠ Titã Sombrio ☠"
    fases:
      - tipo: percentual_vida
        valor: 50
        acao: invocar_mobs
        mob: ZOMBIE
        quantidade: 60
      - tipo: percentual_vida
        valor: 20
        acao: curar
        percentual: 15
    ataques-aleatorios:
      - acao: investida
        forca: 2.2
      - acao: onda_de_choque
        raio: 20
        dano: 40
        forca: 1.3
      - acao: efeito_area
        efeito: SLOWNESS
        duracao-segundos: 6
        amplificador: 1
        raio: 20
      - acao: mensagem
        texto: "&4O Titã Sombrio ruge de fúria!"

  skeleton:
    mob: SKELETON
    nome: "&7&l☠ Carrasco Ósseo ☠"
    fases:
      - tipo: percentual_vida
        valor: 60
        acao: invocar_mobs
        mob: SKELETON
        quantidade: 60
      - tipo: percentual_vida
        valor: 30
        acao: buff_boss
        efeito: SPEED
        duracao-segundos: 15
        amplificador: 3
    ataques-aleatorios:
      - acao: chuva_projeteis
        quantidade: 50
        raio: 40
        dano-por-projetil: 18
      - acao: efeito_area
        efeito: WEAKNESS
        duracao-segundos: 8
        amplificador: 0
        raio: 30
      - acao: mensagem
        texto: "&7O Carrasco Ósseo prepara suas flechas..."

  spider:
    mob: SPIDER
    nome: "&5&l☠ Rainha Aracnídea ☠"
    fases:
      - tipo: percentual_vida
        valor: 50
        acao: invocar_mobs
        mob: CAVE_SPIDER
        quantidade: 60
      - tipo: percentual_vida
        valor: 25
        acao: efeito_area
        efeito: POISON
        duracao-segundos: 10
        amplificador: 2
        raio: 30
    ataques-aleatorios:
      - acao: teleporte_ataque
        distancia: 3.0
        dano-bonus: 36
      - acao: efeito_area
        efeito: POISON
        duracao-segundos: 10
        amplificador: 1
        raio: 30
      - acao: mensagem
        texto: "&5A Rainha Aracnídea se aproxima em silêncio..."

  zombified_piglin:
    mob: ZOMBIFIED_PIGLIN
    nome: "&6&l☠ Açougueiro Infernal ☠"
    fases:
      - tipo: percentual_vida
        valor: 50
        acao: invocar_mobs
        mob: ZOMBIFIED_PIGLIN
        quantidade: 60
      - tipo: percentual_vida
        valor: 20
        acao: curar
        percentual: 20
    ataques-aleatorios:
      - acao: investida
        forca: 2.5
      - acao: onda_de_choque
        raio: 40
        dano: 50
        forca: 1.5
      # Força IV: o golpe vai de 30 pra 42 (8,4 na netherite) por 20 s
      - acao: buff_boss
        efeito: STRENGTH
        duracao-segundos: 20
        amplificador: 3
      - acao: mensagem
        texto: "&6O Açougueiro Infernal avança sedento por sangue!"

  creeper:
    mob: CREEPER
    nome: "&2&l☠ Estilhaço Verde ☠"
    fases:
      - tipo: percentual_vida
        valor: 50
        acao: onda_de_choque
        raio: 40
        dano: 60
        forca: 2.0
      - tipo: percentual_vida
        valor: 20
        acao: invocar_mobs
        mob: CREEPER
        quantidade: 60
    ataques-aleatorios:
      - acao: onda_de_choque
        raio: 40
        dano: 50
        forca: 1.8
      - acao: teleporte_ataque
        distancia: 3
        dano-bonus: 40
      - acao: mensagem
        texto: "&2Um silvo perigoso ecoa pela arena..."

  witch:
    mob: WITCH
    nome: "&d&l☠ Feiticeira Maldita ☠"
    # 2026-11-07: 20.000 de vida (os outros têm os 25.000 do global)
    vida-maxima: 20000
    fases:
      # Wither II por 10 s: 10 de vida, pra quem não se curar
      - tipo: percentual_vida
        valor: 60
        acao: efeito_area
        efeito: WITHER
        duracao-segundos: 10
        amplificador: 1
        raio: 40
      # uma vez só, nos 30%: 10% da vida (era 20%)
      - tipo: percentual_vida
        valor: 30
        acao: curar
        percentual: 10
    ataques-aleatorios:
      - acao: efeito_area
        efeito: POISON
        duracao-segundos: 10
        amplificador: 1
        raio: 50
      - acao: efeito_area
        efeito: WEAKNESS
        duracao-segundos: 10
        amplificador: 0
        raio: 50
      # 2026-11-07: sem "curar" aqui. Com 4 ataques e um sorteio a cada 5 s, ela curava 8% umas 4 vezes por
      # minuto (~150 de vida/s nos 25.000): mais que dois jogadores de netherite tiram. Ficou a Lentidão.
      - acao: efeito_area
        efeito: SLOWNESS
        duracao-segundos: 6
        amplificador: 1
        raio: 50
      - acao: mensagem
        texto: "&dA Feiticeira Maldita prepara uma nova poção..."

  wither:
    mob: WITHER
    nome: "&0&l☠ Flagelo das Trevas ☠"
    especial: true
    # paga tudo em dobro: o dinheiro do ranking e do campeão, o XP de skill, o loot do chão (sorteado 2
    # vezes) e o prêmio do campeão (2 sorteios). Os 2 mapas do tesouro são do TesourosPlugin
    # (drops.boss.mapas-wither). No elite, multiplica junto.
    multiplicador-recompensas: 2
    # o de domingo, com mais gente: uns 10 min com 10 jogadores
    vida-maxima: 60000
    dano-ataque: 36
    fases:
      - tipo: percentual_vida
        valor: 75
        acao: invocar_mobs
        mob: WITHER_SKELETON
        quantidade: 100
      - tipo: percentual_vida
        valor: 50
        acao: onda_de_choque
        raio: 80
        dano: 60
        forca: 3.0
      - tipo: percentual_vida
        valor: 25
        acao: curar
        percentual: 25
    ataques-aleatorios:
      - acao: chuva_projeteis
        quantidade: 100
        raio: 100
        dano-por-projetil: 20
      - acao: onda_de_choque
        raio: 100
        dano: 50
        forca: 1.8
      - acao: teleporte_ataque
        distancia: 2.0
        dano-bonus: 45
      # Wither III por 8 s: 16 de vida, pra quem não se curar
      - acao: efeito_area
        efeito: WITHER
        duracao-segundos: 8
        amplificador: 2
        raio: 60
      - acao: mensagem
        texto: "&0&lO Flagelo das Trevas desperta seu poder ancestral!"
