# Configuração do RankupPlugin

# Ranks em ordem, do primeiro (onde todo jogador começa) ao último. O preço é o custo pra
# SUBIR pra aquele rank (o do primeiro é ignorado). "multiplicador-venda" é o bônus no /sell da
# loja (EconomyShopPlugin): 1.25 = vende 25% mais caro. Cores com &.
# Trocar o id de um rank depois de ter jogadores nele faz eles voltarem pro primeiro rank.
# Os preços foram calibrados pra um jogador ativo sem VIP, com Fortuna III, chegar ao Rei em
# cerca de 150 h de jogo, com as minas de tools/economia/minas-planejadas.yml. Mudou preço,
# mina ou loja? Rode a simulação de novo: python tools/economia/simular.py --meta-horas 150
ranks:
  - id: campones
    nome: "Camponês"
    cor: "&7"
    preco: 0
    multiplicador-venda: 1.0
  - id: fazendeiro
    nome: "Fazendeiro"
    cor: "&a"
    preco: 3400
    multiplicador-venda: 1.05
  - id: lenhador
    nome: "Lenhador"
    cor: "&2"
    preco: 9100
    multiplicador-venda: 1.10
  - id: ferreiro
    nome: "Ferreiro"
    cor: "&8"
    preco: 22000
    multiplicador-venda: 1.15
  - id: mercador
    nome: "Mercador"
    cor: "&e"
    preco: 56000
    multiplicador-venda: 1.20
  - id: escudeiro
    nome: "Escudeiro"
    cor: "&f"
    preco: 140000
    multiplicador-venda: 1.25
  - id: clerigo
    nome: "Clérigo"
    cor: "&b"
    preco: 320000
    multiplicador-venda: 1.30
  - id: cavaleiro
    nome: "Cavaleiro"
    cor: "&9"
    preco: 710000
    multiplicador-venda: 1.40
  - id: barao
    nome: "Barão"
    cor: "&d"
    preco: 2000000
    multiplicador-venda: 1.50
  - id: conde
    nome: "Conde"
    cor: "&5"
    preco: 5400000
    multiplicador-venda: 1.60
  - id: duque
    nome: "Duque"
    cor: "&6"
    preco: 12000000
    multiplicador-venda: 1.75
  - id: rei
    nome: "Rei"
    cor: "&c&l"
    preco: 32000000
    multiplicador-venda: 2.0

# Comandos rodados pelo console quando alguém sobe de rank (também no /ranks admin set).
# %jogador% = nick, %rank% = id do rank novo, %rank_anterior% = id do anterior.
# Exemplo com LuckPerms (crie os grupos rank_<id> antes):
#   - "lp user %jogador% parent remove rank_%rank_anterior%"
#   - "lp user %jogador% parent add rank_%rank%"
comandos-ao-subir: []

# Anuncia pro servidor inteiro quando alguém sobe de rank.
anunciar-rankup: true

chat:
  # Mostra o rank antes do nome no chat. Convive com as tags do clã e do VIP:
  # [Rank] [CLÃ] [VIP Ouro] Nome: mensagem
  tag: true
  formato: "&8[%rank%&8]"
  # O mesmo rank antes do nome na tab (com o VipPlugin: rank, clã e VIP, nessa ordem).
  na-tab: true

prestigio:
  # No último rank, /prestigio volta o jogador pro primeiro e dá um nível de prestígio. O
  # dinheiro fica com ele.
  ativado: true
  maximo: 10
  # Bônus de venda na loja por nível de prestígio (soma com o bônus do rank).
  bonus-venda-percentual: 10
  # Marca antes do rank no chat e na tab. %nivel% vira o nível.
  formato: "&d✦%nivel% "

menus:
  # /ranks e /mina sem argumento abrem um menu. /ranks lista e /mina lista mostram no chat.
  ativado: true

minas:
  # Valores de toda mina nova (cada uma pode mudar com /mina admin intervalo|percentual).
  intervalo-minutos-padrao: 15
  # Reseta quando essa % da mina tiver sido minerada. 0 = só pelo tempo.
  reset-percentual-padrao: 80
  # Aviso pra quem está dentro da mina, X segundos antes do reset por tempo.
  aviso-segundos: [30, 10]
  # Quantos blocos o reset troca por tick. Menos = reset mais lento, porém mais leve.
  blocos-por-tick: 20000
  # Reseta todas as minas quando o servidor liga (a contagem do que foi minerado não é salva).
  resetar-ao-ligar: true
  # Holograma em cima do ponto de teleporte de cada mina, com o tempo até o reset.
  holograma:
    ativado: true
    # Altura acima do ponto de teleporte, em blocos.
    altura: 2.5

# Fragmento Arcano: cai de qualquer bloco quebrado numa mina, com essa chance, e vai pro
# inventário. O Cambista (OficinasPlugin) troca por Eficiência e Fortuna acima do máximo, então é
# raro de propósito: um jogador quebra uns 3.000 a 5.000 blocos por hora, e 0.00025 (1 em 4.000) dá
# cerca de 1 por hora de mina.
fragmentos:
  ativado: true
  chance-por-bloco: 0.00025
  nome: "&d✦ Fragmento Arcano"
  mensagem: "&d&l✦ &dVocê achou um &fFragmento Arcano&d! &7Troque com o Cambista, no fundo da avenida."

protecao:
  # Mundos onde, FORA das minas, ninguém quebra nem coloca blocos (exceto quem tem rankup.admin).
  # Ex: [world] num mundo de rankup em que só as minas são mineráveis. Vazio = sem proteção.
  mundos: []

integracao:
  # Registra o pagamento do rankup no extrato do Bancário.
  pix: true
