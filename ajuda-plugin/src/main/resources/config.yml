        - "/duelo <jogador> [valor] | Desafia pro X1, com aposta"
        - "/duelo aceitar | Aceita o desafio"
        - "/duelo assistir <jogador> | Assiste um duelo"
        - "/gladiador | Evento Gladiador: inscritos e pote"
        - "/gladiador entrar | Se inscreve no Gladiador"
        - "/eventos | Agenda dos eventos e qual é o próximo"
        - "/eventos top | Ranking de vencedores de eventos"
        - "/vietna | Evento Vietnã: derrube os outros na água (inventário vazio)"
        - "/vietna entrar | Se inscreve no Vietnã"
        - "/spleef | Evento Spleef: quebre a neve debaixo dos outros (inventário vazio)"
        - "/spleef entrar | Se inscreve no Spleef"
        - "/correoucai | Evento Corre ou Cai: o chão some onde você pisa (inventário vazio)"
        - "/correoucai entrar | Se inscreve no Corre ou Cai"
        - "/sobrevivencia | Evento Sobrevivência: ondas de invasores, todos juntos (inventário vazio)"
        - "/sobrevivencia entrar | Se inscreve na Sobrevivência"
        - "/corrida | Evento Corrida Maluca: pista de obstáculos (inventário vazio)"
        - "/corrida entrar | Se inscreve na Corrida Maluca"
        - "/labirinto | Evento Labirinto do Fauno: PvP no escuro, com baús escondidos (inventário vazio)"
        - "/labirinto entrar | Se inscreve no Labirinto do Fauno"
        - "/quiz <resposta> | Responde a pergunta do Quiz"
        - "/boss proximo | Quando o próximo boss aparece"
        - "/bounty colocar <jogador> <valor> | Recompensa pela cabeça de alguém"
        - "/bounty lista | Maiores recompensas"
    clas:
      titulo: "Clãs"
      resumo: "Criar e gerenciar clãs"
      comandos:
        - "/cla criar <tag> <nome> | Funda um clã"
        - "/cla convidar <jogador> | Convida alguém"
        - "/cla aceitar | Aceita o convite"
        - "/cla info | Informações do clã"
        - "/cla membros | Membros e quem está online"
        - "/cla top | Ranking de clãs"
        - "/cla depositar <valor> | Dinheiro pro banco do clã"
        - "/cla sair | Sai do clã"
        - "/cc <mensagem> | Chat do clã"
    producao:
      titulo: "Máquinas"
      resumo: "Máquinas, spawners e mercado"
