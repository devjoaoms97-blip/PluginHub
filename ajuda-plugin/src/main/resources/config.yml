# Configuração do AjudaPlugin. Textos aceitam cores com &.

# ------------------------------------------------------------------ /tutorial
# Etapas em ordem, cada uma detectada sozinha. Tipos:
#   minerar-mina  quebrar "quantidade" blocos dentro de uma mina do RankupPlugin
#   vender-loja   vender do inventário pra Loja Oficial (o EconomyShopPlugin avisa; a venda automática das
#                 minas não conta, então quem acabou de chegar não tem o que vender)
#   comando       usar um dos "comandos" (sem a barra; "terreno auto" vale também com argumentos depois)
# "dica" vira um botão que roda o comando.
tutorial:
  convite-ao-entrar: true          # quem nunca começou recebe o convite com o botão [COMEÇAR]
  atraso-convite-segundos: 8       # depois de entrar (dá tempo do login do AuthMe)
  etapas:
    - tipo: minerar-mina
      quantidade: 64
      titulo: "Minere na mina"
      texto: "Use &f/mina&7, escolha a mina do seu rank e quebre &f64 blocos &7nela. O que você quebra já é vendido na hora: o dinheiro aparece na barra (&f+R$&7)."
      dica: "/mina"
    - tipo: comando
      comandos: ["warp loja"]
      titulo: "Conheça a Loja Oficial"
      texto: "Na Loja Oficial (&f/warp loja&7) você compra ferramentas e blocos e vende o que pegar fora das minas."
      dica: "/warp loja"
    - tipo: comando
      comandos: [ranks, rank, rankup]
      titulo: "Conheça os ranks"
      texto: "Abra &f/ranks &7pra ver o preço do próximo rank e o bônus de venda de cada um. Com o dinheiro, &f/rankup &7sobe."
      dica: "/ranks"
    - tipo: comando
      comandos: ["terreno auto", "terrenos auto", "plot auto"]
      titulo: "Ache um terreno"
      texto: "&f/terreno auto &7leva ao terreno à venda mais perto. Lá, &f/terreno comprar &7compra (é a sua base, pras máquinas e spawners)."
      dica: "/terreno auto"
    - tipo: comando
      comandos: [diaria, daily, recompensa]
      titulo: "Pegue a recompensa diária"
      texto: "Todo dia tem uma recompensa em &f/diaria&7: entrando 7 dias seguidos, ela cresce."
      dica: "/diaria"
  premio:
    mapa: comum                    # raridade do Mapa do Tesouro (TesourosPlugin); vazio: sem mapa
    comandos: []                   # rodados pelo console no fim, com {jogador}
    mensagem: "&a✦ Você ganhou um &fMapa do Tesouro Comum&a! Segure ele e use &f/warp tesouros &apra achar o X."

# ------------------------------------------------------------------ /tpa com clique
# O que o jogador vê no Tab e pode usar. Sem isso, o Tab mostrava 322 comandos (cada um repetido com o
# prefixo do plugin, os apelidos do Essentials, WorldEdit, LuckPerms...). O resto responde como comando
# desconhecido. A staff (ajuda.comandos.todos, op) vê e usa tudo. Os botões clicáveis do chat (/tpaccept,
# /pix aceitar, /loja <jogador>...) passam por aqui: o comando deles precisa estar na lista.
comandos-permitidos:
  ativado: true
  mensagem: "&cComando desconhecido. Veja os comandos do servidor em &f/comandos&c."
  lista:
    # ajuda e chat
    - tutorial
    - comandos
    - g
    - msg
    - tell
    - r
    # lugares
    - spawn
    - warp
    - warps
    - mina
    - minas
    - recursos
    - mapa
    - luz
    - montaria
    # rankup e progresso
    - rankup
    - ranks
    - prestigio
    - diaria
    - kit
    - missoes
    - skills
    - boss
    - tesouro
    # terrenos e economia
    - terreno
    - maquinas
    - spawners
    - loja
    - barraca
    - pix
    - ricos
    - milionarios
    - tophoras
    - horas
    - tempojogado
    - cheque
    - minesena
    - achados
    # PvP e clãs
    - cla
    - cc
    - bounty
    - duelo
    - x1
    - gladiador
    - eventos
    - vietna
    - spleef
    - correoucai
    - sobrevivencia
    - corrida
    - labirinto
    - quiz
    # teleporte e casas
    - tpa
    - tpahere
    - tpaccept
    - tpdeny
    - home
    - homes
    - sethome
    - delhome
    # conta, VIP e ajustes
    - login
    - l
    - register
    - reg
    - changepassword
    - logout
    - vincular
    - vip
    - creditos
    - tag
    - echest
    - skin
    - ec
    - bau
    - placar
    - pacote

tpa-clique:
  ativado: true                    # botões [ACEITAR] e [RECUSAR] pra quem recebe um /tpa ou /tpahere

# ------------------------------------------------------------------ /comandos
# Cada página: titulo, resumo (aparece ao passar o mouse no índice), texto (linhas de explicação) e
# comandos ("comando | explicação"; clicar digita o comando no chat, até o primeiro argumento).
comandos:
  titulo: "&6&l✦ Comandos do servidor"
  paginas:
    inicio:
      titulo: "Começo"
      resumo: "Os primeiros passos"
      texto:
        - "Minere, venda na loja e suba de rank: cada rank libera uma mina melhor."
      comandos:
        - "/tutorial | Tutorial com prêmio no fim"
        - "/spawn | Volta pro spawn"
        - "/mina | Menu das minas do seu rank"
        - "/warp loja | Loja Oficial, onde se vende o que minerou"
        - "/ranks | Ranks, preços e bônus de venda"
        - "/rankup | Sobe de rank"
        - "/diaria | Recompensa diária"
        - "/missoes | Missões de hoje"
        - "/missoes barra | Esconde ou mostra a barra das missões"
        - "/g <mensagem> | Chat global (sem o /g, só quem está no seu mundo vê)"
        - "/msg <jogador> <mensagem> | Mensagem privada (/r responde)"
    rankup:
      titulo: "Rankup"
      resumo: "Ranks, minas e prestígio"
      comandos:
        - "/rankup | Paga e sobe pro próximo rank"
        - "/rankup max | Sobe quantos ranks o saldo pagar"
        - "/ranks | Menu dos ranks"
        - "/ranks <jogador> | Rank de outro jogador"
        - "/mina | Menu das minas (clicar teleporta)"
        - "/mina <id> | Vai direto pra uma mina"
        - "/prestigio | No último rank, recomeça com bônus de venda"
        - "/kit iniciante | Kit de quem começa, a cada 2 h (só Camponês)"
    dinheiro:
      titulo: "Dinheiro"
      resumo: "Pix, cheques e loja"
      texto:
        - "Venda nos NPCs da &f/warp loja&7. O Bancário (&f/warp banco&7) vende folhas de cheque e mostra o extrato."
      comandos:
        - "/warp banco | O Banco, no fim da Avenida das Minas"
        - "/ricos | Os mais ricos do servidor"
        - "/tophoras | Quem mais jogou no servidor"
        - "/pix pagar <jogador> <valor> | Paga alguém"
        - "/pix receber <jogador> <valor> | Cobra alguém (ele aceita)"
        - "/pix pendentes | Cobranças em aberto"
        - "/pix qrcode <jogador> <valor> | Cobra um jogador com um botão PAGAR"
        - "/cheque <valor> [jogador] | Transforma a folha da mão num cheque"
        - "/minesena | Loteria do Bancário"
        - "/achados | Itens seus que a limpeza tirou do chão"
    terreno:
      titulo: "Terreno"
      resumo: "Sua base: comprar, imposto e mais"
      texto:
        - "Cada terreno tem 32x32 e cabe até 10 máquinas e 100 spawners."
      comandos:
        - "/terreno auto | Leva ao terreno à venda mais perto"
        - "/terreno comprar | Compra o terreno em que você está"
        - "/terreno home | Vai pro seu terreno"
        - "/terreno lista | Seus terrenos e o imposto"
        - "/terreno imposto pagar | Paga uma semana de imposto"
        - "/terreno autopagar | Liga e desliga o pagamento automático"
        - "/terreno info | Dono e amigos do terreno"
        - "/terreno ir <x;z> | Visita um terreno"
        - "/terreno leiloes | Leilões de terreno"
        - "/terreno abandonar confirmar | Devolve o terreno (apaga o que tem nele)"
    amigo:
      titulo: "Amigos"
      resumo: "Dividir o terreno com amigos"
      texto:
        - "No seu terreno, dê permissão a um amigo. Sem escolher nada, ele ganha todas."
        - "&fconstruir&7: colocar e quebrar · &fbaus&7: abrir baús · &fusar&7: portas, botões e máquinas."
      comandos:
        - "/terreno amigo add <jogador> | Amigo com todas as permissões"
        - "/terreno amigo add <jogador> [construir] [baus] [usar] | Só as permissões escolhidas"
        - "/terreno amigo remover <jogador> | Tira o amigo"
        - "/terreno info | Quem é amigo no terreno"
    teleporte:
      titulo: "Teleporte"
      resumo: "Warps, tpa e casas"
      texto:
        - "Warps: loja, banco, minas, mobs, terrenos, eventos, boss, recursos, nether, end e tesouros."
      comandos:
        - "/spawn | Volta pro spawn"
        - "/warp | Lista as warps"
        - "/warp <nome> | Vai pra uma warp"
        - "/tpa <jogador> | Pede pra ir até alguém"
        - "/tpahere <jogador> | Pede pra alguém vir até você"
        - "/tpaccept | Aceita o pedido (ou clique em [ACEITAR])"
        - "/tpdeny | Recusa o pedido"
        - "/sethome <nome> | Marca uma casa onde você está"
        - "/home <nome> | Vai pra casa"
    combate:
      titulo: "Combate"
      resumo: "Skills, X1, Gladiador, boss e recompensas"
      comandos:
