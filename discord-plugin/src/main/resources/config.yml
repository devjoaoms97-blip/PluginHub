# Configuração do DiscordPlugin (ponte com o Discord)
#
# Os outros plugins mandam os anúncios pra cá, e cada categoria vai pro seu webhook ou pro
# webhook padrão, como um embed com título e cor. Pra pegar a URL: no Discord, Editar canal >
# Integrações > Webhooks > Novo webhook > Copiar URL do webhook. Vazio desliga.
# O tools/discord/estrutura.js cria os webhooks e preenche as URLs e os cargos sozinho.

# Webhook padrão: usado pelas categorias sem webhook próprio.
webhook-url: ""
# Autor das mensagens (cada categoria pode ter o seu "nome"), cor padrão e rodapé dos embeds.
nome: "BrasaMC"
cor: "#f26b1d"
rodape: "BrasaMC"

# Cada categoria aceita:
#   ativado       false desliga a categoria
#   webhook-url   webhook próprio (vazio: o padrão)
#   nome          autor da mensagem
#   titulo        título do embed
#   cor           cor da barra do embed (#rrggbb)
#   mencionar     ID do cargo a marcar (vazio: ninguém). Nunca marca @everyone.
#   mencionar-se  só marca quando o texto bate com este padrão (regex; vazio: sempre)
#   teste         texto extra do /discord teste (útil pra testar a menção)
categorias:
  # Boss apareceu, foi derrotado (com o campeão e o ranking de dano), maldição.
  boss:
    nome: "Boss"
    titulo: "🐉 Boss"
    cor: "#c0392b"
    mencionar: ""
    mencionar-se: "apareceu"
    teste: "(simulação: um chefe apareceu!)"
  # Gladiador aberto, vencedor e destaques.
  gladiador:
    nome: "Gladiador"
    titulo: "⚔️ Gladiador"
    cor: "#e67e22"
    mencionar: ""
    mencionar-se: "inscrições abertas"
    teste: "(simulação: inscrições abertas!)"
  # Leilões de imóvel (terrenos) e de barraca especial: abertos e arrematados.
  leiloes:
    nome: "Leilões"
    titulo: "⚖️ Leilão"
    cor: "#f1c40f"
    mencionar: ""
    mencionar-se: "vai a leilão|está em leilão"
    teste: "(simulação: o terreno vai a leilão)"
  # Barraca alugada e barraca liberada (venceu, saiu ou a staff liberou).
  barracas:
    nome: "Barracas"
    titulo: "🏪 Barracas"
    cor: "#d35400"
  # Alguém ativou um VIP (código da lojinha ou comprado de outro jogador).
  vip:
    nome: "VIP"
    titulo: "💎 VIP"
    cor: "#3498db"
  # Novo Rei e prestígio (encaminhados do chat, veja "encaminhar").
  conquistas:
    nome: "Conquistas"
    titulo: "🏆 Conquista"
    cor: "#9b59b6"
  # Bounty: recompensa grande colocada, cobrada e contrato contra clã.
  bounty:
    nome: "Bounty"
    titulo: "🎯 Bounty"
    cor: "#7f1d1d"
  # Tesouro arcano ou lendário aberto (TesourosPlugin, "anunciar" no config dele).
  tesouros:
    nome: "Tesouros"
    titulo: "🗺️ Tesouro"
    cor: "#d4ac0d"
  # Mine-sena (sorteio do Bancário).
  minesena:
    nome: "Mine-sena"
    titulo: "🎰 Mine-sena"
    cor: "#27ae60"
  # XP em dobro nas skills (encaminhado do chat).
  skills:
    nome: "Skills"
    titulo: "✨ Skills"
    cor: "#8e44ad"
  # Alta de um item na loja (encaminhado do chat).
  loja:
    nome: "Loja"
    titulo: "📈 Mercado"
    cor: "#16a085"
  # Mundo de recursos, Nether ou End resetado (encaminhado do chat).
  recursos:
    nome: "Recursos"
    titulo: "🌲 Mundo de recursos"
    cor: "#2ecc71"
  # Servidor ligou e desligou.
  status:
    nome: "Status"
    titulo: "Servidor"
    cor: "#95a5a6"
  # Pix alto ou suspeito, do PixPlugin: pro canal da STAFF.
  pix:
    nome: "Alerta Pix"
    titulo: "🚨 Pix suspeito"
    cor: "#e74c3c"
  # Alerta do painel da economia (circulação crescendo demais): pro canal da STAFF.
  economia:
    nome: "Economia"
    titulo: "📉 Economia"
    cor: "#e74c3c"

# Anúncios do chat que vão pro Discord sem o plugin de origem precisar saber. O padrão (regex) é
# conferido no texto sem cores; vale o primeiro que bater.
encaminhar:
  - categoria: conquistas
    padrao: "subiu pro rank Rei!"
  - categoria: conquistas
    padrao: "alcançou o prestígio"
  - categoria: skills
    padrao: "XP .* NAS SKILLS!"
  - categoria: loja
    padrao: "^📈 ALTA "
  - categoria: recursos
    padrao: "foi resetado! Vá com /"

status:
  ligou: "🟢 **Servidor online!** Bora jogar."
  desligou: "🔴 **Servidor desligado.** Já já a gente volta."

# API local pro bot do Discord (discord-bot/). Só escuta neste endereço; o bot manda o token no
# cabeçalho Authorization. Token vazio: o plugin gera um na primeira vez e grava aqui.
api:
  ativado: true
  endereco: "127.0.0.1"
  porta: 8155
  token: ""

# Vínculo da conta do Minecraft com a do Discord (/vincular no jogo, /vincular <código> no Discord).
vinculo:
  codigo-minutos: 10
  # Comandos de console na primeira vez que a conta vincula (uma vez por conta do Minecraft e uma
  # por conta do Discord, e só se a conta do Discord tiver idade mínima, conferida pelo bot).
  recompensa:
    - "minesena dar %jogador% 5 vínculo com o Discord"
  mensagem-recompensa: "🎟 Presente pelo vínculo: 5 bilhetes grátis da Mine-sena! Escolha os números no Bancário."
  # Mostrado no /vincular (ex.: "discord.gg/brasamc"). Vazio: não mostra.
  convite: ""

# Loja do Discord: o bot confere o pagamento no Mercado Pago e pede a entrega pela API.
# Comandos de console por pagamento aprovado (uma vez só por pagamento, anotado em entregas.yml).
# %jogador% = nick, %creditos% = quantidade do pacote, %motivo% = "loja <pedido> (pagamento <id>)".
loja:
  comandos:
    - "creditos dar %jogador% %creditos% %motivo%"
