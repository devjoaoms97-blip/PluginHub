name: DiscordPlugin
version: '1.1.0'
main: com.example.discord.DiscordPlugin
api-version: '26.2'
author: Você
description: Ponte com o Discord - anúncios do servidor por webhook, em embeds, com menção aos cargos de aviso.

commands:
  discord:
    description: Testa e recarrega a ponte com o Discord (staff).
    usage: "Uso: /discord teste [categoria] | /discord reload"
    permission: discord.admin
    permission-message: "§cVocê não tem permissão."

permissions:
  discord.admin:
    description: Testa e recarrega a ponte com o Discord.
    default: op
