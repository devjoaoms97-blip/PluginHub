name: DiscordPlugin
version: '1.3.0'
main: com.example.discord.DiscordPlugin
api-version: '26.2'
author: Você
description: Ponte com o Discord - anúncios por webhook, vínculo de contas e API local pro bot.
softdepend: [VipPlugin]

commands:
  discord:
    description: Testa e recarrega a ponte com o Discord e cuida dos vínculos (staff).
    usage: "Uso: /discord teste [categoria|todas] | /discord reload | /discord vinculo <jogador> | /discord desvincular <jogador>"
    permission: discord.admin
    permission-message: "§cVocê não tem permissão."
  vincular:
    description: Gera o código pra vincular sua conta ao Discord.
    usage: "Uso: /vincular"
    permission: discord.vincular

permissions:
  discord.admin:
    description: Testa e recarrega a ponte com o Discord e desfaz vínculos.
    default: op
  discord.vincular:
    description: Vincular a própria conta ao Discord.
    default: true
