# Configuração do AreasPlugin (áreas fechadas)
#
# Lugares de onde só se sai pelo caminho (portões, portais, /spawn), pra quem joga e pra quem assiste.
# Cada área é um mundo inteiro, ou uma caixa nele com "min" e "max" ([x, y, z]):
#   exemplo:
#     mundo: recursos
#     min: [-50, 0, -50]
#     max: [50, 320, 50]
areas:
  # O mundo "spawn" inteiro: o spawn, a avenida das minas, a arena do boss e a Loja Oficial.
  spawn:
    mundo: spawn
  # O mundo "arenas" inteiro: o saguão, o X1, o Gladiador e as plateias.
  arenas:
    mundo: arenas

# O que fica proibido dentro delas. Os admins (permissão areas.ignorar) e quem está no criativo passam.
bloquear:
  construir: true          # quebrar e colocar blocos, balde, fogo, pisotear plantação, moldura, quadro e suporte
                           # de armadura; explosão não abre buraco. As minas do RankupPlugin ficam de fora
  perola: true             # pérola do fim (jogar lá dentro, ou cair lá dentro vindo de fora)
  elytra: true             # planar (quem entra planando cai, sem dano)
  voo: true                # /fly do VIP (quem entra voando cai, sem dano)
  tridente-correnteza: true
  fruta-do-coro: true
  carga-de-vento: true

# PvP só em partes de um mundo: o PvP do mundo fica LIGADO (no Multiverse), mas um jogador só machuca
# outro se os dois estiverem dentro de uma das caixas ([x, y, z] dos cantos). Fora delas, nada: nem
# golpe, nem flecha, nem poção de arremesso. Mundo que não está aqui segue o PvP do próprio mundo.
pvp-so-nas-caixas:
  spawn:
    # A arena do boss, enterrada ao sul do spawn, com a escadaria (estrutura "toxica"): PvP sempre.
    - {nome: "arena do boss", min: [-60, 0, 107], max: [60, 100, 253]}

# Nas áreas listadas, os comandos abaixo não funcionam lá dentro, e o teleporte que um deles acabou
# de pedir (até 10 s) não leva ninguém pra lá: /tpa de fora pra quem está dentro (o /tpaccept lá
# dentro é barrado), /back pro lugar em que morreu na arena, casa antiga marcada lá. /spawn e /warp
# (a plateia) continuam. Os nomes são sem a barra, sem o "essentials:" e com os apelidos.
teleporte-por-comando:
  areas: [arenas]
  comandos: [tpa, tpahere, tpaall, tpaccept, tpyes, tpdeny, tpno, tpacancel, tpauto, tpo, tpohere, tphere, call,
             back, return, home, homes, sethome, createhome, delhome, remhome, rmhome]

# %coisa% vira o que foi barrado ("voar", "usar pérola do fim"...).
mensagem: "&cAqui não dá pra %coisa%: saia pelos portões."
