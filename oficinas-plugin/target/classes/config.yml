sabio:
  # Preço de cada ponto de XP (do nível 0 ao 30 são 1.395 pontos: R$ 2.790 com 2,0).
  preco-por-ponto: 2.0
  pacotes-niveis: [1, 5, 10, 30]
  # Ninguém compra além desse nível.
  nivel-maximo: 50

# Compactador: cada item vira o bloco com "quantidade" dele, e o bloco volta. De graça. Só mexe
# em item comum (sem nome, encantamento ou marca de plugin). Nada de pepita → lingote: o
# "descompactar tudo" desfaria o bloco em lingote e o lingote em pepita.
compactador:
  pares:
    - {item: COAL, bloco: COAL_BLOCK, quantidade: 9}
    - {item: IRON_INGOT, bloco: IRON_BLOCK, quantidade: 9}
    - {item: GOLD_INGOT, bloco: GOLD_BLOCK, quantidade: 9}
    - {item: COPPER_INGOT, bloco: COPPER_BLOCK, quantidade: 9}
    - {item: DIAMOND, bloco: DIAMOND_BLOCK, quantidade: 9}
    - {item: EMERALD, bloco: EMERALD_BLOCK, quantidade: 9}
    - {item: LAPIS_LAZULI, bloco: LAPIS_BLOCK, quantidade: 9}
    - {item: REDSTONE, bloco: REDSTONE_BLOCK, quantidade: 9}
    - {item: NETHERITE_INGOT, bloco: NETHERITE_BLOCK, quantidade: 9}
    - {item: RAW_IRON, bloco: RAW_IRON_BLOCK, quantidade: 9}
    - {item: RAW_GOLD, bloco: RAW_GOLD_BLOCK, quantidade: 9}
    - {item: RAW_COPPER, bloco: RAW_COPPER_BLOCK, quantidade: 9}

# Cambista: troca Fragmentos Arcanos (caem nas minas, ~1 por hora de mina: RankupPlugin,
# fragmentos.chance-por-bloco) e coins por encantamentos acima do máximo no item da mão. Sobe um
# nível por vez: do que o item tem pro primeiro nível da lista, e depois um a um. A chave é o id do
# encantamento no Minecraft. O desconto de VIP vale só nas coins. "itens" diz em que ele pode ir:
# "_PICKAXE" vale pra todo material que termina assim (de madeira a netherita), "BOW" só pro arco.
# Sem "itens", vale o que o jogo aceita.
#
# CARO DE PROPÓSITO. Pela simulação do rankup (tools/economia/simular.py), só Eficiência VIII já
# leva a meta de 150 h até o Rei pra ~90 h, e Eficiência VIII com Fortuna VIII pra ~75 h. Os custos
# abaixo somam ~105 h de mina em fragmentos pra Eficiência VIII e ~175 h pra Fortuna VIII, mais
# R$ 3 mi e R$ 6 mi. O Saque vai só até VI (um acima do que o vanilla e a mina deixam: III da mesa,
# IV e V nos kits) e mexe nos drops dos mobs e dos spawners, por isso cada nível é caro.
cambista:
  encantamentos:
    efficiency:
      nome: "Eficiência"
      itens: [_PICKAXE, _AXE, _SHOVEL, _HOE]
      niveis:
        6: {fragmentos: 15, preco: 250000}
        7: {fragmentos: 30, preco: 750000}
        8: {fragmentos: 60, preco: 2000000}
    fortune:
      nome: "Fortuna"
      # machado fica de fora: Fortuna não muda nada em tora
      itens: [_PICKAXE, _SHOVEL, _HOE]
      niveis:
        6: {fragmentos: 25, preco: 500000}
        7: {fragmentos: 50, preco: 1500000}
        8: {fragmentos: 100, preco: 4000000}
    sharpness:
      nome: "Afiação"
      itens: [_SWORD, _AXE]
      niveis:
        6: {fragmentos: 20, preco: 300000}
        7: {fragmentos: 40, preco: 900000}
        8: {fragmentos: 80, preco: 2500000}
    protection:
      nome: "Proteção"
      itens: [_HELMET, _CHESTPLATE, _LEGGINGS, _BOOTS]
      niveis:
        6: {fragmentos: 12, preco: 200000}
        7: {fragmentos: 25, preco: 600000}
        8: {fragmentos: 50, preco: 1600000}
    power:
      nome: "Poder"
      itens: [BOW]
      niveis:
        6: {fragmentos: 15, preco: 250000}
        7: {fragmentos: 30, preco: 750000}
        8: {fragmentos: 60, preco: 2000000}
    looting:
      nome: "Saque"
      itens: [_SWORD]
      niveis:
        4: {fragmentos: 20, preco: 300000}
        5: {fragmentos: 40, preco: 900000}
        6: {fragmentos: 80, preco: 2500000}
    unbreaking:
      nome: "Inquebrável"
      # ferramentas, armas e armaduras (tudo o que gasta)
      itens: [_PICKAXE, _AXE, _SHOVEL, _HOE, _SWORD, _SPEAR, _HELMET, _CHESTPLATE, _LEGGINGS, _BOOTS, BOW, CROSSBOW,
              TRIDENT, MACE, SHIELD, FISHING_ROD, SHEARS, ELYTRA]
      niveis:
        4: {fragmentos: 8, preco: 100000}
        5: {fragmentos: 16, preco: 300000}
        6: {fragmentos: 32, preco: 800000}

# Desconto em todos os serviços por permissão (vale o maior). Os grupos de VIP já têm essas
# permissões (as mesmas do desconto da loja). LISTA de propósito: chave com ponto viraria seção.
vip-descontos:
  - permissao: "vip.desconto.diamante"
    percentual: 12
  - permissao: "vip.desconto.ouro"
    percentual: 9
  - permissao: "vip.desconto.prata"
    percentual: 6
  - permissao: "vip.desconto.bronze"
    percentual: 3

integracao:
  # Registra os pagamentos no extrato do Bancário (precisa do PixPlugin).
  pix: true
