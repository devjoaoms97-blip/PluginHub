        valor: 75
        acao: invocar_mobs
        mob: WITHER_SKELETON
        quantidade: 50
      - tipo: percentual_vida
        valor: 50
        acao: onda_de_choque
        raio: 80
        dano: 100
        forca: 3.0
      - tipo: percentual_vida
        valor: 25
        acao: curar
        percentual: 25
    ataques-aleatorios:
      - acao: chuva_projeteis
        quantidade: 100
