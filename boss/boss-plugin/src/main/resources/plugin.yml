name: BossPlugin
version: '1.0.0'
main: com.example.boss.BossPlugin
api-version: '26.2'
author: Você
description: Boss mundial agendado, com fases por vida/tempo, loot configurável e tag de campeão via LuckPerms.
softdepend: [LuckPerms, DiscordPlugin, Vault, SkillsPlugin, VipPlugin]

commands:
  boss:
    description: Gerencia o boss mundial.
    # sem permissão aqui: o /boss proximo é pra todos; o resto o próprio comando confere (boss.admin)
    usage: "Uso: /boss proximo | /boss <start|stop|setlocal|additem|addchampionitem|reload>"

permissions:
  boss.admin:
    description: Permite gerenciar o boss mundial (start, loot, arena, etc).
    default: op
