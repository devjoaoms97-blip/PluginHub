        duracao-segundos: 20
        amplificador: 3
      - acao: mensagem
        texto: "&6O Açougueiro Infernal avança sedento por sangue!"

  creeper:
    mob: CREEPER
    nome: "&2&l☠ Estilhaço Verde ☠"
    fases:
      - tipo: percentual_vida
        valor: 50
        acao: onda_de_choque
        raio: 40
        dano: 100
        forca: 2.0
      - tipo: percentual_vida
        valor: 20
        acao: invocar_mobs
        mob: CREEPER
        quantidade: 30
    ataques-aleatorios:
      - acao: onda_de_choque
        raio: 40
        dano: 80
        forca: 1.8
      - acao: teleporte_ataque
        distancia: 3
        dano-bonus: 50
      - acao: mensagem
        texto: "&2Um silvo perigoso ecoa pela arena..."

  witch:
    mob: WITCH
    nome: "&d&l☠ Feiticeira Maldita ☠"
    fases:
      - tipo: percentual_vida
        valor: 60
        acao: efeito_area
        efeito: WITHER
        duracao-segundos: 10
        amplificador: 2
        raio: 40
      - tipo: percentual_vida
        valor: 30
        acao: curar
        percentual: 20
    ataques-aleatorios:
