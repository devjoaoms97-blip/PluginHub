      - tipo: percentual_vida
        valor: 20
        acao: curar
        percentual: 20
    ataques-aleatorios:
      - acao: investida
        forca: 2.5
      - acao: onda_de_choque
        raio: 40
        dano: 50
        forca: 1.5
      - acao: buff_boss
