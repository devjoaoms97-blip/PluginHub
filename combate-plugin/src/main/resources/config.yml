# Configuração do CombatePlugin (combate no estilo da 1.8)
#
# Só o que foi escolhido muda. Ataque em área, repulsão, regeneração, maçãs, ender pearl,
# escudo e machado continuam como no jogo atual. Vale no servidor todo.

sem-recarga:
  # Sem a barra de recarga do ataque: todo golpe sai com o dano inteiro, por mais rápido que se
  # clique. O limite é o tempo entre golpes (invulnerabilidade, abaixo).
  ativado: true

invulnerabilidade:
  # Tempo mínimo entre dois golpes cheios de jogador no mesmo alvo, em ticks (20 = 1 s). Ajusta o
  # dano por segundo: 10 é o padrão do jogo (e da 1.8), 5 dobra o ritmo e 0 faz todo clique contar.
  # Só vale pra golpe corpo a corpo de jogador; lava, fogo, cacto e explosão seguem o jogo.
  # Dá pra mudar com o servidor ligado: /combate intervalo <ticks>
  ticks-entre-golpes: 10
  # Cada mão com o próprio tempo: quem alterna as duas mãos bate duas vezes mais. Desligado,
  # as duas mãos dividem o mesmo tempo.
  separar-maos: true

bloqueio-espada:
  # Segurar o botão direito com a espada levanta a espada e reduz o dano, como na 1.8. Só
  # vale sem escudo na segunda mão (com escudo, quem bloqueia é o escudo).
  ativado: true
  # Quanto do dano o bloqueio tira (a 1.8 tirava metade).
  reducao-percentual: 50
  # De que ângulo os golpes são bloqueados, à frente do jogador. 180 = de qualquer lado, como
  # na 1.8. O escudo usa 90 (só pela frente).
  angulo: 180

duas-maos:
  # O botão direito num inimigo bate com o que está na segunda mão (cada mão pode ter uma arma
  # diferente). Mirando em outro lugar, a espada da mão principal bloqueia.
  ativado: true
  # Fim do nome dos itens que contam como arma curta.
  armas: [_SWORD, _AXE]
  # Com a segunda mão vazia, o botão direito no inimigo é um soco.
  soco: true

arma-de-longe:
  # Carregar a besta (ou puxar o arco) trava a espada: enquanto carrega, e por um tempo depois de
  # disparar, nenhum golpe corpo a corpo conta (espada, machado ou soco, de qualquer mão). Bater e
  # depois carregar continua livre. Sem isso, com a besta numa mão e a espada na outra, dava pra
  # carregar, bater e disparar no mesmo combo.
  ativado: true
  armas: [BOW, CROSSBOW]
  trava-depois-de-disparar-ms: 500

em-combate:
  # Quem bate ou apanha de outro jogador fica em combate por "segundos" (VIP ou não). Só conta o
  # golpe que valeu: no spawn sem PvP nada marca. Em combate, os comandos abaixo não funcionam, e
  # nenhum teleporte por comando leva o jogador (o /tpaccept de outro, o fim da espera do Essentials).
  ativado: true
  segundos: 5
  # Sem a barra e sem o "plugin:". Duas palavras ("vip warp") barram só aquele subcomando.
  comandos: [spawn, warp, warps, home, homes, back, return, tpa, tpahere, tpaall, tpaccept, tpyes, tpo, tpohere,
             tphere, tpauto, call, recursos, mina, minas, vip warp, duelo assistir]
  # Quem sai do servidor em combate morre na hora, com os itens no chão (expulsão e desligamento do
  # servidor não contam). Nos mundos ignorados (as arenas), o Gladiador e o duelo tratam a desconexão.
  morrer-ao-deslogar: true
  mundos-ignorados: [arenas]
  mensagens:
    entrou: "&c⚔ Em combate! &7Sem teleporte, e quem desloga morre."
    comando: "&c⚔ Você está em combate! Espere &f%s s &cpra teleportar."
    deslogou: "&c☠ &f%jogador% &cdeslogou em combate e morreu."

contagem-teleporte:
  # A espera do teleporte do Essentials (teleport-delay, 3 s pra quem não é VIP) ganha um aviso a cada
  # segundo que falta, e qualquer dano na espera cancela (sozinho, o Essentials só cancela no ataque de
  # uma entidade de quem pode andar). O primeiro aviso ("Teleporte em 3 segundos.") e o "Teleportando..."
  # são mensagens do próprio Essentials (plugins/Essentials/messages).
  ativado: true
  segundos: "&6Teleporte em &c%s segundos&6."
  um-segundo: "&6Teleporte em &c1 segundo&6."
  cancelado: "&cTeleporte cancelado."
