name: EventosPlugin
version: '1.0.0'
main: com.example.eventos.EventosPlugin
api-version: '26.2'
author: Você
description: Eventos do servidor. Vietnã (derrubar os outros dos pilares na água), Spleef (quebrar a neve debaixo dos outros), Corre ou Cai (o chão some onde se pisa), Sobrevivência (ondas de invasores, todos juntos), Corrida Maluca (pista de obstáculos) e o Quiz no chat.
softdepend: [Vault, ChequePlugin, DiscordPlugin, AreasPlugin]

commands:
  quiz:
    description: Quiz no chat (responda com /quiz <resposta>).
    usage: "Uso: /quiz <resposta> | /quiz | /quiz top"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."
  eventos:
    description: Agenda dos eventos, o que está rolando e o próximo.
    usage: "Uso: /eventos"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."
  vietna:
    description: Evento Vietnã.
    usage: "Uso: /vietna <entrar|sair|info|assistir|top>"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."
  sobrevivencia:
    description: Evento Sobrevivência.
    usage: "Uso: /sobrevivencia <entrar|sair|info|assistir|top>"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."
  correoucai:
    description: Evento Corre ou Cai.
    usage: "Uso: /correoucai <entrar|sair|info|assistir|top>"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."
  corrida:
    description: Evento Corrida Maluca.
    usage: "Uso: /corrida <entrar|sair|info|assistir|top>"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."
  spleef:
    description: Evento Spleef.
    usage: "Uso: /spleef <entrar|sair|info|assistir|top>"
    permission: eventos.usar
    permission-message: "§cVocê não tem permissão para os eventos."

permissions:
  eventos.usar:
    description: Permite se inscrever e assistir aos eventos.
    default: true
  eventos.admin:
    description: Abre, inicia e cancela os eventos, constrói a arena e usa comandos dentro dela.
    default: op
  eventos.ip.ignorar:
    description: Pula a trava de uma inscrição por IP (só pros bots de teste, que entram todos pelo mesmo IP).
    default: false
