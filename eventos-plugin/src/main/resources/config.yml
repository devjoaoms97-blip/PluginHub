# Configuração do EventosPlugin

# ---------------------------------------------------------------------------------------------
# Vietnã: pilares de 2x2 sobre a água. Cada um nasce num pilar com o mesmo kit (arco, bola de
# neve, carga de vento e vara de pesca) e tenta derrubar os outros. Ninguém perde vida: os golpes só
# empurram. Caiu na água (ou saiu da arena), está fora e vai pra arquibancada. O último de pé leva
# o prêmio num cheque. Só entra quem está com o inventário totalmente vazio (nem armadura), e um por IP.
# ---------------------------------------------------------------------------------------------
vietna:
  # Abre sozinho todo dia nesses horários (HH:mm). Lista vazia desativa.
  agenda: ["10:00", "16:00"]

  inscricao:
    duracao-segundos: 180
    avisos-segundos: [120, 60, 30, 10]
  minimo-jogadores: 3

  # Cheque do servidor (ChequePlugin) pro vencedor; se o tempo acabar com mais de um de pé, divide.
  # Sem o ChequePlugin, o valor cai direto na conta.
  premio: 10000

  luta:
    # nos pilares, sem kit, antes de começar
    preparacao-segundos: 10
    # depois disso, quem estiver de pé divide o prêmio
    tempo-maximo-minutos: 8

  # Contra quem fica parado: depois de "comecar-segundos" de luta, a cada "intervalo-segundos" um pilar
  # fica vermelho por "aviso-segundos" e some (quem está nele cai). Sempre sobra pelo menos "minimo".
  pilares-somem:
    comecar-segundos: 120
    intervalo-segundos: 12
    aviso-segundos: 3
    minimo: 2

  # O kit de cada um, entregue quando a luta começa. O arco tem Impulso e Infinidade (1 flecha basta).
  kit:
    arco-impulso: 1
    bolas-de-neve: 16
    cargas-de-vento: 3
    vara-de-pesca: true
    # a cada "segundos", soma "quantidade" de volta até o máximo do kit
    reabastecer:
      segundos: 30
      bolas-de-neve: 8
      cargas-de-vento: 1

  # Empurrão de cada coisa que acerta (os golpes não tiram vida: o plugin cancela o dano e empurra).
  # A flecha empurra conforme a força do tiro (arco puxado até o fim = o valor cheio). Soco não vale.
  empurrao:
    flecha: 1.3
    bola-de-neve: 0.9
    carga-de-vento: 0.6
    vara-de-pesca: 0.4
    vertical: 0.35

  # A arena, construída pelo plugin no começo de cada evento (os pilares voltam). "agua-y" é o bloco
  # de cima da água; os pilares sobem "altura" blocos acima dela. 6 x 6 pilares de 2x2 com 3 blocos de
  # vão (dá pra pular de um pro outro correndo) e a arquibancada no lado norte, atrás de um vidro.
  arena:
    mundo: arenas
    centro: [0, 600]
    agua-y: 64
    pilares-por-lado: 6
    vao: 3
    altura: 6

  # Na arena e na arquibancada, só esses comandos funcionam (sem a barra; a staff passa). Nenhum
  # teleporte de fora (/tpa, /home, /back...) leva alguém pra lá: só os do próprio evento.
  comandos-liberados: [vietna, spawn]

# ---------------------------------------------------------------------------------------------
# Spleef: três pisos redondos de neve sobre a água. Todos com a mesma pá (Eficiência V, quebra a neve
# na hora): quebre o chão debaixo dos outros. Sem bola de neve e sem soco. Quem cai de um piso vai pro
# de baixo; do último, cai na água e está fora (vai pra arquibancada). O último de pé leva o cheque.
# Mesmas regras de inscrição do Vietnã: grátis, inventário totalmente vazio e uma por IP. Só um evento
# fica aberto por vez.
# ---------------------------------------------------------------------------------------------
spleef:
  # Abre sozinho todo dia nesses horários (HH:mm): o Vietnã é às 10:00 e 16:00, o Gladiador e o dragão à noite.
  agenda: ["13:00", "18:00"]

  inscricao:
    duracao-segundos: 180
    avisos-segundos: [120, 60, 30, 10]
  minimo-jogadores: 3
  premio: 10000

  luta:
    preparacao-segundos: 10
    tempo-maximo-minutos: 8

  # Contra quem fica parado: depois de "comecar-segundos" de luta, a cada "intervalo-segundos"
  # "blocos-por-vez" blocos de neve viram gelo (o aviso) e somem "aviso-segundos" depois. Só nos andares
  # em que ainda tem alguém de pé.
  derreter:
    comecar-segundos: 120
    intervalo-segundos: 2
    blocos-por-vez: 10
    aviso-segundos: 1

  kit:
    eficiencia: 5

  # A arena, construída pelo plugin no começo de cada evento (os pisos voltam): "andares" pisos de neve
  # de "raio" blocos, um a cada "distancia-andares" acima da água ("agua-y" é o bloco de cima dela),
  # dentro de um anel de vidro, e a arquibancada no lado norte.
  arena:
    mundo: arenas
    centro: [0, 900]
    agua-y: 64
    raio: 15
    andares: 3
    distancia-andares: 6

  comandos-liberados: [spleef, spawn]

# ---------------------------------------------------------------------------------------------
# Corre ou Cai: três pisos coloridos sobre a água, sem kit. O bloco em que alguém pisa fica vermelho e
# some logo depois: quem para, cai. Quem cai de um piso vai pro de baixo; do último, cai na água e está
# fora (vai pra galeria). O último de pé leva o cheque. Mesmas regras de inscrição dos outros eventos.
# ---------------------------------------------------------------------------------------------
correoucai:
  # Abre sozinho todo dia nesses horários (HH:mm).
  agenda: ["11:00", "17:00"]

  inscricao:
    duracao-segundos: 180
    avisos-segundos: [120, 60, 30, 10]
  minimo-jogadores: 3
  premio: 10000

  luta:
    preparacao-segundos: 10
    tempo-maximo-minutos: 8

  chao:
    # o bloco some esse tanto depois de alguém pisar (20 ticks = 1 s; 10 = meio segundo)
    some-em-ticks: 10
    # no começo da luta, o chão não some por esses segundos (ninguém cai na largada)
    graca-segundos: 3

  # A arena, construída pelo plugin (/correoucai construir); a cada evento, só os pisos voltam.
  # "raio" é a metade do lado do piso quadrado (12 = 25 x 25); um andar a cada "distancia-andares".
  arena:
    mundo: arenas
    centro: [0, 1200]
    agua-y: 64
    raio: 12
    andares: 3
    distancia-andares: 6

  comandos-liberados: [correoucai, spawn]

# ---------------------------------------------------------------------------------------------
# Sobrevivência: todos juntos, com o mesmo kit de ferro, contra 10 ondas de invasores no pátio de um
# castelo sitiado, com chefe na 5 e na 10. Os mobs machucam de verdade; quem morre está fora (sem perder
# nada: só o kit estava com ele) e vai pra galeria. Quem estiver vivo quando a última onda cair divide o
# prêmio; se todos morrerem, ninguém ganha. Sem fogo amigo. Mesmas regras de inscrição dos outros.
# ---------------------------------------------------------------------------------------------
sobrevivencia:
  agenda: ["22:00"]

  inscricao:
    duracao-segundos: 180
    avisos-segundos: [120, 60, 30, 10]
  minimo-jogadores: 3
  # dividido entre quem chegar vivo ao fim da última onda (ou do tempo máximo)
  premio: 10000

  luta:
    preparacao-segundos: 10
    tempo-maximo-minutos: 20

  kit:
    # armadura, espada e arco de ferro (inquebráveis) vêm sempre; aqui, o que se conta
    flechas: 32
    macas-douradas: 4
    # quando uma onda cai, cada um vivo ganha mais essas flechas
    flechas-por-onda: 16

  ondas:
    # entre uma onda e a próxima
    pausa-segundos: 10
    # cada jogador a mais (além do primeiro) põe essa fração a mais de mobs e de vida nos chefes
    a-mais-por-jogador: 0.5
    # uma linha por onda: "TIPO:quantidade, ..." (tipos do Minecraft), pra 1 jogador
    lista:
      - "PILLAGER:3, VINDICATOR:1"
      - "PILLAGER:3, VINDICATOR:3"
      - "PILLAGER:4, VINDICATOR:2, WITCH:1"
      - "PILLAGER:4, VINDICATOR:4, WITCH:2"
      - "PILLAGER:4"
      - "PILLAGER:5, VINDICATOR:4, WITCH:2"
      - "PILLAGER:5, VINDICATOR:5, EVOKER:1"
      - "PILLAGER:6, VINDICATOR:5, WITCH:3, EVOKER:1"
      - "PILLAGER:6, VINDICATOR:6, WITCH:3, EVOKER:2"
      - "VINDICATOR:4, EVOKER:1"
    # o chefe de cada onda (vida em pontos: 2 = 1 coração; dano = multiplicador do golpe)
    chefes:
      "5": {tipo: VINDICATOR, nome: "&c&lCapitão Saqueador", vida: 120, dano: 1.5}
      "10": {tipo: RAVAGER, nome: "&4&lDevastador", vida: 300, dano: 1.0}

  # O pátio do castelo, construído pelo plugin (/sobrevivencia construir). "raio" é a metade do lado
  # (15 = 31 x 31); "chao-y" é o bloco do chão.
  arena:
    mundo: arenas
    centro: [0, 1500]
    chao-y: 64
    raio: 15

  comandos-liberados: [sobrevivencia, spawn]

# ---------------------------------------------------------------------------------------------
# Corrida Maluca: uma pista de obstáculos num pavilhão de parque de diversões, sem kit (só correr e
# pular). Quem cai na água volta pro último checkpoint: ninguém sai por cair. Os primeiros a cruzar a
# chegada levam os cheques de "premios", na ordem. Acaba quando o pódio fecha, quando todos chegam ou
# no tempo máximo (quem não chegou não ganha). Mesmas regras de inscrição dos outros. Decisões de 2026-11-02.
# ---------------------------------------------------------------------------------------------
corrida:
  # Abre sozinho todo dia nesses horários (HH:mm).
  agenda: ["09:00", "14:00"]

  inscricao:
    duracao-segundos: 180
    avisos-segundos: [120, 60, 30, 10]
  minimo-jogadores: 3
  # 1º, 2º e 3º lugar
  premios: [5000, 3000, 2000]

  luta:
    preparacao-segundos: 10
    tempo-maximo-minutos: 5

  # Duas fileiras de 3 portas iguais: essas abrem (sorteadas a cada corrida) quando alguém encosta; as
  # outras são parede.
  portas:
    abertas-por-fileira: 1

  # O slime joga por cima do vão (velocidade, em blocos por tique).
  trampolim:
    impulso-cima: 0.9
    impulso-frente: 0.65

  # O tapete rolante empurra pra trás quem está em cima, a cada "a-cada-ticks" (o jogador perde o embalo).
  tapete:
    empurrao: 0.3
    a-cada-ticks: 10

  # Dois grupos de plataformas, em xadrez, alternando (meio ciclo um do outro): firme, vermelha (aviso) e sumida.
  plataformas:
    firme-segundos: 3
    aviso-segundos: 1
    sumida-segundos: 2

  # As barras na altura do pé, uma lista por pivô (o primeiro e o segundo disco): quantos braços (2 =
  # uma cruz), a velocidade e a força do empurrão.
  barras:
    bracos: [1, 2]
    graus-por-segundo: [72, 60]
    forca: 1.1

  # Os 4 canhões da ponte do vento, nas paredes, soltam uma carga de vento cada um, revezando.
  vento:
    a-cada-segundos: 2
    velocidade: 0.7

  # A pista, construída pelo plugin (/corrida construir), de "inicio" pro norte (+z), uns 145 blocos; a
  # cada corrida, só o portão, as portas e as plataformas voltam. "agua-y" é o bloco de cima da piscina.
  arena:
    mundo: arenas
    inicio: [0, 1800]
    agua-y: 64

  comandos-liberados: [corrida, spawn]

# ---------------------------------------------------------------------------------------------
# Quiz: uma rodada de perguntas no chat, sem arena e sem inscrição (responde quem estiver online, de
# onde estiver, com /quiz <resposta>). Cada pergunta vale 1 ponto pra quem acertar primeiro; quem fizer
# mais pontos leva o prêmio (dividido no empate). A resposta não liga pra acento, maiúscula nem pra
# "o"/"a" na frente. Sem mínimo de jogadores (decisão de 2026-11-02). Roda junto com os outros eventos.
# ---------------------------------------------------------------------------------------------
quiz:
  agenda: ["12:00", "15:00"]
  perguntas-por-rodada: 10
  segundos-por-pergunta: 20
  # entre uma pergunta e a próxima
  pausa-segundos: 5
  premio: 5000
  # cada jogador só tenta de novo depois desse tempo (contra chutar as contas no automático)
  espera-entre-tentativas-segundos: 2

  # quantas vezes cada tipo entra no sorteio de cada pergunta ("conta" e "palavra" são geradas na hora)
  pesos:
    servidor: 3
    minecraft: 3
    conta: 2
    palavra: 2

  # A primeira resposta é a que aparece; as outras também valem.
  servidor:
    - {pergunta: "Qual comando mostra a agenda dos eventos?", respostas: ["/eventos", "eventos"]}
    - {pergunta: "Quantos andares de neve tem o Spleef?", respostas: ["3", "tres"]}
    - {pergunta: "Qual comando liga a visão noturna?", respostas: ["/luz", "luz"]}
    - {pergunta: "Qual é o primeiro rank do servidor?", respostas: ["Camponês", "campones"]}
    - {pergunta: "Qual é o último rank do rankup?", respostas: ["Rei"]}
    - {pergunta: "Quantas ondas tem a Sobrevivência?", respostas: ["10", "dez"]}
    - {pergunta: "Qual comando sobe de rank?", respostas: ["/rankup", "rankup"]}
    - {pergunta: "Que horas o Dragão do End renasce?", respostas: ["21h", "21", "21:00", "21 horas"]}
    - {pergunta: "Qual NPC troca Fragmentos Arcanos por encantamentos?", respostas: ["Cambista"]}
    - {pergunta: "Qual comando mostra as suas skills?", respostas: ["/skills", "skills"]}
    - {pergunta: "Qual comando pega a recompensa de todo dia?", respostas: ["/diaria", "diaria"]}
    - {pergunta: "Qual comando manda dinheiro pra outro jogador?", respostas: ["/pix", "pix"]}
    - {pergunta: "Qual o nome do NPC guia do spawn?", respostas: ["Zé", "ze", "ze o guia"]}
    - {pergunta: "Em que dia da semana o boss é o Wither?", respostas: ["Domingo"]}
    - {pergunta: "Qual skill de profissão quebra 3x3 com a picareta?", respostas: ["Minerador"]}
    - {pergunta: "Qual comando abre as missões?", respostas: ["/missoes", "missoes"]}
    - {pergunta: "Qual evento tem pilares sobre a água?", respostas: ["Vietnã", "vietna", "vietnam"]}
    - {pergunta: "Qual é o chefe da onda 10 da Sobrevivência?", respostas: ["Devastador", "ravager"]}
    - {pergunta: "Que horas é o sorteio da Mine-sena?", respostas: ["18h", "18", "18:00", "18 horas"]}
    - {pergunta: "Qual comando põe uma recompensa pela cabeça de alguém?", respostas: ["/bounty", "bounty"]}
    - {pergunta: "Em qual evento o chão some onde você pisa?", respostas: ["Corre ou Cai", "correoucai"]}
    - {pergunta: "Qual comando leva pro mundo de recursos?", respostas: ["/warp recursos", "warp recursos"]}
    - {pergunta: "Qual skill de profissão ganha XP pescando?", respostas: ["Pescador"]}
    - {pergunta: "Qual comando abre o Quiz e mostra como ele funciona?", respostas: ["/quiz", "quiz"]}

  minecraft:
    - {pergunta: "Quantos blocos de obsidiana tem um portal do Nether mínimo (sem os cantos)?", respostas: ["10", "dez"]}
    - {pergunta: "Que item doma um lobo?", respostas: ["Osso", "ossos"]}
    - {pergunta: "Quantos olhos do Ender completam o portal do End?", respostas: ["12", "doze"]}
    - {pergunta: "Qual mob verde explode quando chega perto?", respostas: ["Creeper"]}
    - {pergunta: "Quantos lingotes de ferro faz uma armadura de ferro completa?", respostas: ["24", "vinte e quatro"]}
    - {pergunta: "Em que dimensão fica o Ender Dragon?", respostas: ["End", "the end"]}
    - {pergunta: "Quantos espaços tem a barra rápida (hotbar)?", respostas: ["9", "nove"]}
    - {pergunta: "Que minério se usa, junto com obsidiana e livro, pra fazer a mesa de encantamento?", respostas: ["Diamante", "diamantes"]}
    - {pergunta: "O que o Wither deixa cair quando morre?", respostas: ["Estrela do Nether", "nether star"]}
    - {pergunta: "Quantos ticks tem um segundo no Minecraft?", respostas: ["20", "vinte"]}
    - {pergunta: "O que usar na cabeça pra olhar pro Enderman sem ele atacar?", respostas: ["Abóbora", "abobora", "abobora entalhada"]}
    - {pergunta: "Que mob vira bruxa quando é atingido por um raio?", respostas: ["Aldeão", "aldeao", "villager"]}
    - {pergunta: "Qual mob deixa cair a lágrima?", respostas: ["Ghast"]}
    - {pergunta: "Qual encantamento faz a ferramenta gastar mais devagar?", respostas: ["Inquebrável", "inquebravel", "inquebrabilidade", "unbreaking"]}
    - {pergunta: "Quantos diamantes fazem um bloco de diamante?", respostas: ["9", "nove"]}
    - {pergunta: "Que comida faz o porco te seguir?", respostas: ["Cenoura", "cenoura no palito", "batata", "beterraba"]}
    - {pergunta: "Qual o bloco mais duro que se quebra com picareta de diamante?", respostas: ["Obsidiana"]}
    - {pergunta: "Que ferramenta corta lã das ovelhas?", respostas: ["Tesoura"]}
    - {pergunta: "Qual mob fica nas fortalezas do Nether e solta varas de blaze?", respostas: ["Blaze"]}
    - {pergunta: "Quantas tábuas saem de um tronco?", respostas: ["4", "quatro"]}
    - {pergunta: "Qual minério se acha no Nether e vira netherite?", respostas: ["Detrito ancestral", "detritos ancestrais", "ancient debris"]}
    - {pergunta: "Que bloco o aldeão bibliotecário usa como mesa de trabalho?", respostas: ["Atril", "atril de leitura", "lectern"]}
    - {pergunta: "Em que mob o porco vira quando é atingido por um raio?", respostas: ["Piglin zumbificado", "porco zumbi", "zombified piglin"]}
    - {pergunta: "Quantas lãs vão no crafting de uma cama?", respostas: ["3", "tres"]}

  # palavras pro "desembaralhe" (sem acento fica mais justo)
  palavras: [diamante, esmeralda, creeper, picareta, obsidiana, enderman, redstone, espada, machado, fornalha,
             bigorna, lanterna, cambista, montaria, gladiador, castelo, saqueador, esqueleto, aranha, netherite,
             encantamento, tridente, minerador, pescador, lenhador, galinha, abobora, melancia]
