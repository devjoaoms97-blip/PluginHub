# Loot de cada raridade. O dono do mapa recebe as coins (entre o mínimo e o máximo; iguais = valor
# fixo) num cheque, que vira dinheiro novo na economia quando é depositado no Bancário, e "rolagens" itens, cada um sorteado pelo peso
# (sem repetir: cada item sai no máximo uma vez por baú).
#
# Cada item é um destes:
#   item: MATERIAL                       um item comum
#   item: fragmento                      Fragmento Arcano (do RankupPlugin)
#   item: "livro:<encantamento>:<nível>" livro encantado (ex: livro:mending:1)
#   item: "spawner:<tipo>"               spawner do SpawnersPlugin (zumbi, blaze, golem...)
#   item: "maquina:<tipo>"               máquina nova do MaquinasPlugin (tear, forja, reator...); só
#                                        quem tem o rank dela coloca e usa, mas dá pra vender
#   item: combustivel                    Células de Combustível do MaquinasPlugin
#   itemstack: ...                       um item qualquer, posto pelo /tesouro loot add (com nome, encantamentos...)
# qtd: [mínimo, máximo] (padrão [1, 1]).

comum:
  coins: [5000, 5000]
  rolagens: 2
  itens:
    ferro: {item: IRON_BLOCK, qtd: [4, 8], peso: 25}
    ouro: {item: GOLD_BLOCK, qtd: [2, 4], peso: 15}
    maca: {item: GOLDEN_APPLE, qtd: [1, 2], peso: 15}
    xp: {item: EXPERIENCE_BOTTLE, qtd: [8, 16], peso: 15}
    fragmento: {item: fragmento, qtd: [1, 1], peso: 10}
    combustivel: {item: combustivel, qtd: [16, 32], peso: 15}
    zumbi: {item: "spawner:zumbi", qtd: [1, 1], peso: 3}
    esqueleto: {item: "spawner:esqueleto", qtd: [1, 1], peso: 2}

