    fragmento: {item: fragmento, qtd: [1, 2], peso: 10}
    eficiencia: {item: "livro:efficiency:5", peso: 4}
    inquebravel: {item: "livro:unbreaking:3", peso: 4}
    fortuna: {item: "livro:fortune:3", peso: 4}
    combustivel: {item: combustivel, qtd: [32, 64], peso: 12}
    aranha: {item: "spawner:aranha", qtd: [1, 1], peso: 3}
    creeper: {item: "spawner:creeper", qtd: [1, 1], peso: 3}
    slime: {item: "spawner:slime", qtd: [1, 1], peso: 3}
